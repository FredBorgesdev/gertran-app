<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">

<div class="pages-header">
  <div class="row m-b-10">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="d-md-flex">
        <div class="m-r-20">
          <h2 *ngIf="item?.id">Editar risk-area - {{item?.tradingName}}</h2>
          <h2 *ngIf="!item?.id">Adicionar risk-area</h2>
        </div>
      </div>
    </div>
  </div>
</div>
<nz-card>
  
  <form nz-form nzLayout="vertical" [formGroup]="validateForm">
<div class="row">
  <div class="col-lg-6 col-md-12 m-b-10">
    <nz-form-item>
      <nz-form-label nzRequired nzFor="name">Nome da área</nz-form-label>
      <nz-form-control nzErrorTip="Insira o nome da área">
        <input id="name" nz-input formControlName="name" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
    <nz-form-item>
      <nz-form-label nzRequired nzFor="latitude">Latitude</nz-form-label>
      <nz-form-control nzErrorTip="Insira a latitude">
        <input id="latitude" nz-input formControlName="latitude" type="number" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
    <nz-form-item>
      <nz-form-label nzRequired nzFor="longitude">Longitude</nz-form-label>
      <nz-form-control nzErrorTip="Insira a longitude">
        <input id="longitude" nz-input formControlName="longitude" type="number" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
    <nz-form-item>
      <nz-form-label nzRequired nzFor="radius_risk_area">Raio (em metros)</nz-form-label>
      <nz-form-control nzErrorTip="Insira o raio da área">
        <input id="radius_risk_area" nz-input formControlName="radius_risk_area" type="number" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
    <nz-form-item>
      <nz-form-label nzRequired nzFor="point_type">Tipo de ponto</nz-form-label>
      <nz-form-control nzErrorTip="Selecione o tipo">
        <nz-select formControlName="point_type" id="point_type">
          <nz-option [nzValue]="'risk-area'" [nzLabel]="'Área de risco'"></nz-option>
          <nz-option [nzValue]="'allowed-point'" [nzLabel]="'Ponto permitido'"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  </div>
</div>

    <nz-divider></nz-divider>

    <nz-form-item>
      <nz-form-control>
        <div class="page-buttons">
          <button type="button" (click)="navigateToList()" nz-button>
            <i nz-icon nzType="unordered-list"></i>Listar RiskArea
          </button>
          <button type="button" (click)="save()" nz-button nzType="primary">
            <i nz-icon nzType="save"></i>Salvar RiskArea
          </button>
        </div>
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-card>
</nz-spin>
