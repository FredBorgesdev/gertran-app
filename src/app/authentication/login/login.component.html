<div
  class="container-fluid p-h-0 p-v-20 h-100 bg"

>
  <div class="d-flex flex-column justify-content-between h-100">
    <div class="d-none d-md-block"></div>
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-7 col-lg-5 m-h-auto">
          <nz-card class="m-b-100 shadow-lg">
            <div class="d-flex align-items-center justify-content-between m-b-30">
              <img class="logo" alt="" src="assets/images/logo/logogertran.png">
            </div>

            <nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading"></nz-spin>

            <form nz-form [formGroup]="loginForm" nzLayout="vertical" class="login-form" (ngSubmit)="submitForm()">
              <nz-form-item>
                <nz-form-label nzRequired nzFor="cpf">CPF</nz-form-label>
                <nz-form-control nzErrorTip="Informe o seu cpf">
                  <nz-input-group [nzPrefix]="prefixEmail">
                    <input
                      type="text"
                      nz-input
                      formControlName="cpf"
                      placeholder="123456789"
                      [textMask]="{ mask: cpfMask, guide: false }"
                    >
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
              <nz-form-item class="relative">
                <nz-form-label nzRequired nzFor="password">Senha</nz-form-label>
                <nz-form-control nzErrorTip="Informe sua senha">
                  <nz-input-group [nzPrefix]="prefixLock">
                    <input type="password" nz-input formControlName="password" placeholder="Senha">
                  </nz-input-group>
                </nz-form-control>
              </nz-form-item>
              <nz-form-item class=" m-b-0">
                <nz-form-control>
                  <div class="d-flex align-items-center justify-content-end">
                    <button nz-button class="login-form-button" [nzType]="'primary'">Entrar</button>
                  </div>
                </nz-form-control>
              </nz-form-item>
              <!-- <nz-form-item> -->
              <!--   <nz-form-control> -->
              <!--     <div class="d-flex align-items-center justify-content-end"> -->
              <!--       <button -->
              <!--         nz-button -->
              <!--         nzDanger -->
              <!--         class="login-form-button" -->
              <!--         [nzType]="'primary'" -->
              <!--         type="button" -->
              <!--         (click)="goToFirstAccessForm()" -->
              <!--       >Primeiro acesso GERTRAN 3.0 -->
              <!--       </button> -->
              <!--     </div> -->
              <!--   </nz-form-control> -->
              <!-- </nz-form-item> -->
            </form>
            <ng-template #prefixEmail><i nz-icon nzType="idcard"></i></ng-template>
            <ng-template #prefixLock><i nz-icon nzType="lock"></i></ng-template>
          </nz-card>
        </div>
      </div>
    </div>
    <div class="d-none d-md-flex p-h-40 copyright">
        <span
        style="color:#000000;"
        >
          Copyright © 2023 Gertran. Todos os direitos reservados.
        </span>
    </div>
  </div>
</div>
