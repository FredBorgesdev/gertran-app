<form nz-form nzLayout="vertical" [formGroup]="validateForm">
  <nz-form-item>
    <nz-form-label nzRequired nzFor="name">Nome</nz-form-label>
    <nz-form-control nzErrorTip="Preencha o campo">
      <input nz-input formControlName="name" id="name" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="description">Descrição</nz-form-label>
    <nz-form-control nzErrorTip="Preencha o campo">
      <input nz-input formControlName="description" id="description" />
    </nz-form-control>
  </nz-form-item>
</form>
