<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  <nz-card>

    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="dashboard"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        <a><i nz-icon nzType="idcard"></i><span>Terminais</span></a>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item *ngIf="resource?.id">
        Editar Terminal ({{resource?.name}})
      </nz-breadcrumb-item>
      <nz-breadcrumb-item *ngIf="!resource?.id">
        Adicionar Terminal
      </nz-breadcrumb-item>
    </nz-breadcrumb>

    <nz-divider></nz-divider>

    <nz-tabset>
      <nz-tab nzTitle="Dados do terminal">
        <form nz-form nzLayout="vertical" [formGroup]="validateForm">
          <nz-form-item>
            <nz-form-label nzRequired nzFor="terminalGroup">Grupo</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="terminalGroup" nzShowSearch nzAllowClear nzPlaceHolder="Selecione o grupo" nzServerSearch>
                <nz-option *ngFor="let terminalGroup of terminalGroups" [nzLabel]="terminalGroup.name" [nzValue]="terminalGroup.id"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label nzRequired nzFor="name">Nome</nz-form-label>
            <nz-form-control nzErrorTip="Preencha o campo">
              <input nz-input formControlName="name" id="name" placeholder="Nome do terminal" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label nzRequired nzFor="description">Descrição</nz-form-label>
            <nz-form-control nzErrorTip="Preencha o campo">
              <input nz-input formControlName="description" id="description" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control [nzOffset]="7" [nzSpan]="12">
              <button type="button" (click)="save()" nz-button nzType="primary">
                <i nz-icon nzType="save"></i>Salvar
              </button>
              <button type="button" (click)="list()" nz-button>
                <i nz-icon nzType="unordered-list"></i>Listar Terminais
              </button>
            </nz-form-control>
          </nz-form-item>
        </form>
      </nz-tab>

      <nz-tab nzTitle="Veiculos">
        <nz-transfer
          [nzDataSource]="vehicleTransferItems"
          [nzTitles]="['Veiculos', 'Veiculos do terminal']"
          [nzShowSearch]="true"
          [nzSearchPlaceholder]="'Pesquisar veiculo'"
          [nzNotFoundContent]="'Nenhum veiculo encontrado'"
          [nzOperations]="['Adicionar', 'Remover']"
          [nzListStyle]="{ 'width': '50%' }"
          [nzItemUnit]="'Veiculo'"
          [nzItemsUnit]="'Veiculos'"
          [nzRenderList]="[renderListBackPagination, renderListFrontPagination]"
          (nzChange)="handleChange($event)"
        >
          <ng-template
            #renderListBackPagination
            let-items
            let-stat="stat"
            let-onItemSelectAll="onItemSelectAll"
            let-onItemSelect="onItemSelect"
          >
            <nz-table
              #table
              [nzData]="items"
              nzSize="small"
              [nzData]="resources?.results"
              [nzTotal]="resources?.count"
              [nzPageSize]="resources?.limit"
              [nzPageIndex]="page"
              [nzFrontPagination]="false"
              (nzQueryParams)="handleQueryParamsChange($event)"
            >
              <thead>
              <tr>
                <th
                  [nzChecked]="stat.checkAll"
                  [nzIndeterminate]="stat.checkHalf"
                  (nzCheckedChange)="onItemSelectAll($event)"
                ></th>
                <th>Placa</th>
              </tr>
              </thead>
              <tbody>
              <tr *ngFor="let data of table.data" (click)="onItemSelect(data)">
                <td
                  [nzChecked]="!!data.checked"
                  (nzCheckedChange)="onItemSelect(data)"
                ></td>
                <td>{{ data.title }}</td>
              </tr>
              </tbody>
            </nz-table>
          </ng-template>

          <ng-template
            #renderListFrontPagination
            let-items
            let-stat="stat"
            let-onItemSelectAll="onItemSelectAll"
            let-onItemSelect="onItemSelect"
          >
            <nz-table
              #table
              [nzData]="items"
              nzSize="small"
            >
              <thead>
              <tr>
                <th
                  [nzChecked]="stat.checkAll"
                  [nzIndeterminate]="stat.checkHalf"
                  (nzCheckedChange)="onItemSelectAll($event)"
                ></th>
                <th>Placa</th>
              </tr>
              </thead>
              <tbody>
              <tr *ngFor="let data of table.data" (click)="onItemSelect(data)">
                <td
                  [nzChecked]="!!data.checked"
                  (nzCheckedChange)="onItemSelect(data)"
                ></td>
                <td>{{ data.title }}</td>
              </tr>
              </tbody>
            </nz-table>
          </ng-template>
        </nz-transfer>

        <nz-form-item class="m-t-20">
          <nz-form-control [nzOffset]="7" [nzSpan]="12">
            <button type="button" (click)="saveVehicles()" nz-button nzType="primary">
              <i nz-icon nzType="save"></i>Salvar
            </button>
          </nz-form-control>
        </nz-form-item>
      </nz-tab>
    </nz-tabset>
  </nz-card>
</nz-spin>
