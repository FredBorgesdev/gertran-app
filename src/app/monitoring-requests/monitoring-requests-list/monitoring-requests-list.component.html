<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  <nz-card>
    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="dashboard"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        Solicitações de monitoramento
      </nz-breadcrumb-item>
    </nz-breadcrumb>

    <nz-divider></nz-divider>

    <div class="row m-b-30">
      <div class="col-lg-4">
        <div class="d-md-flex">
          <div class="m-b-10">
            <nz-input-group [nzPrefix]="prefixTemplate" class="w-100">
              <input
                type="text"
                nz-input
                placeholder="Buscar por placa"
                [(ngModel)]="search"
                (ngModelChange)="filterByPlate()"
                class="w-100"
              >
            </nz-input-group>
            <ng-template #prefixTemplate>
              <i nz-icon nzType="search" class="opacity-05"></i>
            </ng-template>
          </div>
        </div>
      </div>
      <div class="col-lg-8 text-right">
        <button
          (click)="create()"
          nz-button
          nzType="primary"
        >
          <i nz-icon nzType="plus" theme="outline"></i>
          <span>Adicionar Solicitações de monitoramento</span>
        </button>
      </div>
    </div>

    <app-monitoring-requests-filter
      (filterData)="filterData($event)"
    ></app-monitoring-requests-filter>
  </nz-card>

  <nz-card
    [nzTitle]="'Rascunho' + ' (' + draftResponse?.count + ')'"
    *ngIf="authService.customerId"
    data-testid="table-draft"
  >
    <app-monitoring-requests-table
      [monitoringRequests]="draftResponse"
      [rowColor]="'#f7faff'"
      (view)="view($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (handleQueryParamsChange)="handleQueryParamsChangeDraft($event)"
      (refreshAll)="loadAllResources()"
    ></app-monitoring-requests-table>
  </nz-card>

  <nz-card
    [nzTitle]="'Em análise' + ' (' + underReviewResponse?.count + ')'"
  >
    <app-monitoring-requests-table
      [monitoringRequests]="underReviewResponse"
      [rowColor]="'#73ffb2'"
      (view)="view($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (handleQueryParamsChange)="handleQueryParamsChangeUnderReview($event)"
      (refreshAll)="loadAllResources()"
    ></app-monitoring-requests-table>
  </nz-card>

  <nz-card
    [nzTitle]="'Aguardando inicio' + ' (' + waitingForStartResponse?.count + ')'"
  >
    <app-monitoring-requests-table
      [monitoringRequests]="waitingForStartResponse"
      [rowColor]="'#EAFDF2FF'"
      (view)="view($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (handleQueryParamsChange)="handleQueryParamsChangeWaitingForStart($event)"
      (refreshAll)="loadAllResources()"
    ></app-monitoring-requests-table>
  </nz-card>

  <nz-card
    [nzTitle]="'Em viagem' + ' (' + inProgressResponse?.count + ')'"
  >
    <app-monitoring-requests-table
      [monitoringRequests]="inProgressResponse"
      [rowColor]="'#91aaff'"
      (view)="view($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (handleQueryParamsChange)="handleQueryParamsChangeInProgress($event)"
      (refreshAll)="loadAllResources()"
    ></app-monitoring-requests-table>
  </nz-card>

  <nz-card
    [nzTitle]="'Reprovado' + ' (' + reprovedResponse?.count + ')'"
  >
    <app-monitoring-requests-table
      [monitoringRequests]="reprovedResponse"
      [rowColor]="'#ff6a6a'"
      (view)="view($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (handleQueryParamsChange)="handleQueryParamsChangeReproved($event)"
      (refreshAll)="loadAllResources()"
    ></app-monitoring-requests-table>
  </nz-card>

  <nz-card
    [nzTitle]="'Cancelado' + ' (' + resources?.count + ')'"
  >
    <app-monitoring-requests-table
      [monitoringRequests]="resources"
      [rowColor]="'#a9a9a9'"
      (view)="view($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (handleQueryParamsChange)="handleQueryParamsChange($event)"
      (refreshAll)="loadAllResources()"
    ></app-monitoring-requests-table>
  </nz-card>
</nz-spin>
