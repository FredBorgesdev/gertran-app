<nz-table #table [nzData]="monitoringRequests" [nzFrontPagination]="false" nzSize="small" nzTableLayout="fixed"
  class="custom-table">
  <thead>
    <tr>
      <th class="text-center table-header" style="width: 14%;">Data/hora</th>
      <th class="text-center table-header" style="width: 10%;">Placa</th>
      <th class="text-center table-header" style="width: 15%;">Tecnologia</th>
      <th class="text-center table-header">Cliente</th>
      <th class="text-center table-header" style="width: 16%;">Atualização</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let data of table.data; index as i" [class]="getRowName(data)">
      <td class="text-center max-width-cell"><strong>{{ data.createdAt | date: 'dd/MM/yyyy HH:mm' }}</strong></td>
      <td class="text-center max-width-cell"><strong>{{ data.truck.vehicle.plate }}</strong></td>
      <td class="text-center max-width-cell"><strong>{{ data.trackerTechnology?.name ?? '-' }}</strong></td>
      <td class="text-center max-width-cell"><strong>{{ data.customer.tradingName }}</strong></td>
      <td class="text-center max-width-cell"><strong>{{ getUpdateDiff(data) }}</strong></td>
    </tr>
  </tbody>
</nz-table>
