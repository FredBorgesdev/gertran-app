<nz-table
  #table
  [nzData]="monitoringRequests"
  [nzFrontPagination]="false"
  nzSize="small"
  nzTableLayout="fixed"
  class="custom-table"
>
  <thead >
  <tr >
    <th class="text-center table-header" style="width: 14%;">Data/hora</th>
    <th class="text-center table-header" style="width: 9%;">Placa</th>
    <th class="text-center table-header" style="width: 11%;">Tecnologia</th>
    <th class="text-center table-header">Cliente</th>
    <th class="text-center table-header"style="width: 15%;">Atualização</th>
  </tr>
  </thead>

  <tbody>
  <tr
    *ngFor="let data of table.data; index as i"
    [class]="getRowName(data)"
  >
    <td class="text-center max-width-cell">{{ data.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
    <td class="text-center max-width-cell">{{ data.truck.vehicle.plate }}</td>
    <td class="text-center max-width-cell">{{ data.trackerTechnology?.name ?? '-' }}</td>
    <td class="text-center max-width-cell">{{ data.customer.tradingName }}</td>
    <td class="text-center max-width-cell">{{ getUpdateDiff(data) }}</td>
  </tr>
  </tbody>
</nz-table>
