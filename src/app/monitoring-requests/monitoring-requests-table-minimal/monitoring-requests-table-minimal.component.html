<nz-table
  #table
  [nzData]="monitoringRequests"
  nzBordered
  class="m-t-50"
  [nzFrontPagination]="false"
  nzTableLayout="fixed"
>
  <thead>
  <tr>
    <th>Status</th>
    <th>Solicitação</th>
    <th>Cliente</th>
    <th>Atualizado em</th>
    <th>Ação</th>
  </tr>
  </thead>

  <tbody>
  <tr *ngFor="let data of table.data; index as i">
    <td [class]="'bg-' + data.status">{{ getTitle(data.status) }}</td>
    <td nz-tooltip [nzTooltipTitle]="data.id">{{ data.id | id }}</td>
    <td>
      {{ data.customer.tradingName }}
    </td>
    <td>{{ getUpdateDiff(data) }}</td>
    <td>
      <div class="d-flex align-items-center" *ngIf="data.status === 'under_review'">
            <span class="m-r-5">
              {{getUnderReviewAlert(data).message}}
            </span>

        <div [class]="getUnderReviewAlert(data).class"></div>
      </div>
    </td>
  </tr>
  </tbody>
</nz-table>
