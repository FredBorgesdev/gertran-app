<nz-list nzItemLayout="vertical" [nzLoading]="isLoading">
  <div class="list-item" *ngFor="let item of monitoringRequests?.results">
    <div class="d-flex flex-column w-100">
      <div nz-row class="w-100">
        <div nz-col nzSpan="5">
        <span nz-tooltip [nzTooltipTitle]="item.id">
          SM <strong>{{ item.id | id}}</strong>
        </span>
        </div>

        <div nz-col nzSpan="1">
          <div class="vertical-bar"></div>
        </div>

        <div nz-col nzSpan="18">
        <span>
          Empresa: <strong>{{item.customer.tradingName}}</strong>
        </span>
        </div>
      </div>

      <div class="m-t-10 d-flex justify-content-between">
        <span>
          Transportadora: <strong>{{ item.transporter.tradingName }}</strong>
        </span>

        <div class="d-flex" *ngIf="item.status === 'under_review'">
          <span class="m-r-10">
            {{getUpdateDiff(item)}}
          </span>

          <div class="vertical-bar m-r-10"></div>

          <div class="d-flex align-items-center">
            <span class="m-r-5">
              {{getUnderReviewAlert(item).message}}
            </span>

            <div [class]="getUnderReviewAlert(item).class"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nz-list-empty *ngIf="monitoringRequests?.results.length === 0"></nz-list-empty>
</nz-list>
