<nz-spin [nzSpinning]="isLoading">

  <!--
    <nz-breadcrumb>
    <nz-breadcrumb-item>
      <i nz-icon nzType="bar-chart"></i>
    </nz-breadcrumb-item>
    <nz-breadcrumb-item>
      <a><i nz-icon nzType="line-chart"></i><span>Histórico de comandos</span></a>
    </nz-breadcrumb-item>
  </nz-breadcrumb>
  -->
  <div class="pages-header">
    <div class="row m-b-10">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="d-md-flex">
          <div class="m-r-20">
            <h2>Histórico de comandos</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nz-card>
    <app-base-vehicle-filter (generateReport)="generateReport($event)" [rows]="commandSentHistory"
      [fileName]="'Histórico de comandos'"></app-base-vehicle-filter>

    <nz-table #table [nzData]="commandSentHistory" nzBordered class="m-t-50" [nzFrontPagination]="false">
      <thead>
        <tr>
          <th>Data</th>
          <th>Comando</th>
          <th>Usuário</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let data of table.data; index as i">
          <td>{{ data.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ data.code + '-' + data.observations }}</td>
          <td>{{ data.sentByUser?.name }}</td>
        </tr>
      </tbody>
    </nz-table>
  </nz-card>
</nz-spin>
