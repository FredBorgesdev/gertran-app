<div class="moldura">
  <div style="margin: 2%;">

    <h1 class="text-center m-b-1">
      TORRE DE CONTROLE 2
    </h1>

    <img src="assets/images/logo/logogertran.png" alt="Gertran" class="logo">
    <br>

    <div style="display: flex; flex-direction: column;">
      <div style="flex: 0.5; max-width: 99%;">
        <app-grid [nzPageSize]="6"></app-grid>
      </div>
      <div style="display: flex; flex: 1.2;">
        <div style="flex: 5; min-width: 48%; margin-right: 0.5%;">
          <app-client-monitoring-requests [hideHeader]="true"></app-client-monitoring-requests>
        </div>
        <div style="flex: 5; min-width: 48%;">
          <app-client-checklists [hideHeader]="true"></app-client-checklists>
        </div>
      </div>

      <div style="flex: 0.2;">
      </div>
    </div>


    <app-fixed-buttons></app-fixed-buttons>
  </div>
</div>
