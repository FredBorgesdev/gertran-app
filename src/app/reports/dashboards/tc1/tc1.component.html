<div class="moldura">
  <div class="dash-header">
    <div class="logo">
      <img src="assets/images/logo/logogertran.png" alt="Gertran">
    </div>
    <h3>TORRE DE CONTROLE 1 - OPERAÇÕES</h3>
  </div>
  <nz-card>
    <div class="row">

      <div class="col-lg-12 col-md-12 col-sm-12 m-b-10">
        <nz-card nzTitle="RESUMO DE OPERAÇÕES - ÚLTIMOS 7 DIAS" class="operations-card">

          <nz-table #operationsTable [nzData]="operationsData" [nzPageSize]="15" [nzShowPagination]="false"
            [nzFrontPagination]="false" nzSize="small" class="operations-table custom-table">
            <thead>
              <tr>
                <th class="text-center table-header">DATA</th>
                <th class="text-center table-header">TOTAL VIAGENS DIÁRIAS</th>
                <th class="text-center table-header">EM ANDAMENTO</th>
                <th class="text-center table-header">FINALIZADAS</th>
                <th class="text-center table-header">AGUARDANDO</th>
                <th class="text-center table-header">VALOR TOTAL</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of operationsTable.data">
                <td class="text-center"><strong>{{ data.date }}</strong></td>
                <td class="text-center">
                  <nz-tag [nzColor]="'blue'" style="font-size: 16px; padding: 8px 16px;">
                    <strong>{{ data.total }}</strong>
                  </nz-tag>
                </td>
                <td class="text-center">
                  <nz-tag [nzColor]="'green'" style="font-size: 16px; padding: 8px 16px;">
                    <strong>{{ data.inProgress }}</strong>
                  </nz-tag>
                </td>
                <td class="text-center">
                  <nz-tag [nzColor]="'default'" style="font-size: 16px; padding: 8px 16px;">
                    <strong>{{ data.finished }}</strong>
                  </nz-tag>
                </td>
                <td class="text-center">
                  <nz-tag [nzColor]="'orange'" style="font-size: 16px; padding: 8px 16px;">
                    <strong>{{ data.waiting }}</strong>
                  </nz-tag>
                </td>
                <td class="text-center">
                  <nz-tag [nzColor]="'cyan'" style="font-size: 16px; padding: 8px 16px;">
                    <strong>{{ formatCurrency(data.totalValue) }}</strong>
                  </nz-tag>
                </td>
              </tr>
            </tbody>
          </nz-table>
        </nz-card>
      </div>

    </div>
    <app-fixed-buttons></app-fixed-buttons>
  </nz-card>
</div>
