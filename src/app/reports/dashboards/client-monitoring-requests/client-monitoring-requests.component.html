<div class="moldura">

  <div class="dash-header" [class.header-small]="hideHeader">

    <div class="logo" *ngIf="!hideHeader">
      <img src="assets/images/logo/logogertran.png" alt="Gertran">
    </div>

    <h3 *ngIf="!hideHeader">SOLICITAÇÕES DE MONITORAMENTO</h3>

  </div>

  <div class="d-flex justify-content-between m-b-10" *ngIf="!hideHeader" style="padding: 0 15px;">
    <span>
      <div class="square bg-danger"></div> Acima de 15 minutos
      <div class="square bg-alert"></div> Acima de 10 minutos
      <div class="square bg-default"></div> No prazo
    </span>
  </div>

  <app-monitoring-requests-table-client [underReview]="underReviewResponse"
    (handleQueryParamsChange)="handleQueryParamsChange($event, loadUnderReview)"></app-monitoring-requests-table-client>

</div>
