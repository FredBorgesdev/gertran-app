<div class="moldura" #contentDiv>
  <div class="dash-header">
    <div class="logo">
      <img src="assets/images/logo/logogertran.png" alt="Gertran">
    </div>

    <div class="header-content">
      <h3>VIAGENS POR TERMINAIS</h3>
    </div>

    <button nz-button nzType="primary" (click)="toggleFullScreen()" class="btn-fullscreen"
      [class.btn-hidden]="isFullScreen">
      <i nz-icon [nzType]="isFullScreen ? 'compress' : 'expand'"></i>
      <span class="btn-text">{{ isFullScreen ? 'Sair' : 'Tela Cheia' }}</span>
    </button>
  </div>

  <nz-card>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 m-b-10">
        <nz-card class="chart-card">
          <div class="chart-wrapper">
            <div class="canvas-container">
              <canvas id="operationsPositionsChart"></canvas>
            </div>

            <div class="legend-container">
              <div class="total-info">
                <strong>TOTAL DE VIAGENS</strong>
                <div class="total-value">{{ operationsPositionsData.totalOperationsPositionsData }}</div>
              </div>
              <ul class="legend-list">
                <li *ngFor="let label of operationsPositionsData.labels" class="legend-item">
                  <span [style.background-color]="label.color" class="color-indicator"></span>
                  <div class="legend-details">
                    <strong class="legend-name">{{ label.status }}</strong>
                    <span class="legend-count">{{ getPositionData(label) }} viagens</span>
                  </div>
                </li>
              </ul>
            </div>
          </div>
        </nz-card>
      </div>
    </div>
  </nz-card>
</div>
