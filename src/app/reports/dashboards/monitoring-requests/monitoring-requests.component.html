<div class="m-b-15 text-center">
  <h3 [class]="(hideHeader && 'header-small') + ' text-center m-b-0'">
    Solicitações de monitoramento
  </h3>

  <h4 [class]="(hideHeader && 'header-small') + ' text-center'">
    Hora atual: {{ currentTime }} - Próxima atualização em {{ formatSeconds(nextUpdate) }}
  </h4>

  <img
    *ngIf="!hideHeader"
    src="assets/images/logo/logogertran.png"
    alt="Gertran"
    class="logo"
  >
</div>

<div class="d-flex justify-content-between" *ngIf="!hideHeader">
  <div></div>

  <span>
    <div class="square bg-danger"></div> Acima de 15 minutos
    <div class="square bg-alert"></div> Acima de 10 minutos
    <div class="square bg-default"></div> No prazo
  </span>
</div>

<app-monitoring-requests-table-minimal
  [underReview]="underReviewResponse"
  (handleQueryParamsChange)="handleQueryParamsChange($event, loadUnderReview)"
></app-monitoring-requests-table-minimal>
