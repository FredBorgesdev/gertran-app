<div nz-row nzGutter="16">
  <div nz-col nzSpan="12">
    <nz-card
      [nzTitle]="'Em análise' + ' (' + (underReviewResponse?.count ?? 0) + ')'"
    >
      <app-monitoring-requests-table-minimal
        [monitoringRequests]="underReviewResponse"
        [rowColor]="'#ffd773'"
        (handleQueryParamsChange)="handleQueryParamsChange($event, loadUnderReview)"
      ></app-monitoring-requests-table-minimal>
    </nz-card>
  </div>

  <div nz-col nzSpan="12">
    <nz-card
      [nzTitle]="'Aprovadas' + ' (' + (approvedResponse?.count ?? 0) + ')'"
    >
      <app-monitoring-requests-table-minimal
        [monitoringRequests]="approvedResponse"
        [rowColor]="'#73deff'"
        (handleQueryParamsChange)="handleQueryParamsChange($event, loadApproved)"
      ></app-monitoring-requests-table-minimal>
    </nz-card>

    <nz-card
      [nzTitle]="'Rejeitadas' + ' (' + (reprovedResponse?.count ?? 0) + ')'"
    >
      <app-monitoring-requests-table-minimal
        [monitoringRequests]="reprovedResponse"
        [rowColor]="'#ff7373'"
        (handleQueryParamsChange)="handleQueryParamsChange($event, loadReproved)"
      ></app-monitoring-requests-table-minimal>
    </nz-card>
  </div>
</div>
