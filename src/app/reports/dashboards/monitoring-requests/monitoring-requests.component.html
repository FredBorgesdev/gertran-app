<div class="moldura" #contentDiv>
  <div class="dash-header">
    <div class="logo">
      <img src="assets/images/logo/logogertran.png" alt="Gertran">
    </div>

    <div class="header-content">
      <h3>LIBERAÇÃO</h3>
    </div>

    <button nz-button nzType="primary" (click)="toggleFullScreen()" class="btn-fullscreen"
      [class.btn-hidden]="isFullScreen">
      <i nz-icon [nzType]="isFullScreen ? 'compress' : 'expand'"></i>
      <span class="btn-text">{{ isFullScreen ? 'Sair' : 'Tela Cheia' }}</span>
    </button>
  </div>

  <nz-card>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 m-b-20">
        <nz-card class="operations-card">

          <div class="d-flex justify-content-start m-b-20" style="align-items: center; gap: 20px;">
            <span style="display: flex; align-items: center;">
              <div class="square bg-danger m-r-5" style="width: 20px; height: 20px; display: inline-block;"></div>
              Acima de 15 minutos
            </span>
            <span style="display: flex; align-items: center;">
              <div class="square bg-alert m-r-5"
                style="width: 20px; height: 20px; display: inline-block; background-color: #faad14;"></div>
              Acima de 10 minutos
            </span>
            <span style="display: flex; align-items: center;">
              <div class="square bg-default m-r-5"
                style="width: 20px; height: 20px; display: inline-block; background-color: #d9d9d9;"></div>
              No prazo
            </span>
          </div>

          <app-monitoring-requests-table-minimal [underReview]="underReviewResponse"
            (handleQueryParamsChange)="handleQueryParamsChange($event, loadUnderReview)"></app-monitoring-requests-table-minimal>

        </nz-card>
      </div>
    </div>
  </nz-card>
</div>
