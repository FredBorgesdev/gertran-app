<div class="m-b-30 text-center">
  <h4>
    Hora atual: {{ currentTime }} - Próxima atualização em {{ formatSeconds(nextUpdate) }}
  </h4>
</div>

<span>
  {{ 'Aguardando liberação' + ' (' + (underReviewResponse?.count ?? 0) + ')' }}
  {{ 'Aprovadas' + ' (' + (approvedResponse?.count ?? 0) + ')' }}
  {{ 'Rejeitadas' + ' (' + (reprovedResponse?.count ?? 0) + ')' }}
</span>

<app-monitoring-requests-table-minimal
  [underReview]="underReviewResponse"
  [approved]="approvedResponse"
  [reproved]="reprovedResponse"
  (handleQueryParamsChange)="handleQueryParamsChange($event, loadUnderReview)"
></app-monitoring-requests-table-minimal>
