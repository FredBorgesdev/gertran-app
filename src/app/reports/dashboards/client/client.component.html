<div class="dash-header">
  <div class="logo">
    <img src="assets/images/logo/logogertran.png" alt="Gertran">
  </div>
  <h3>CCG – CENTRO DE CONTROLE GERTRAN</h3>
</div>
<nz-card>
  <div class="row content">
    <div class="col-lg-12 col-md-12 col-sm-12 m-b-10" style="display: flex;">
      <app-grid></app-grid>
    </div>
    <div class="col-lg-12" style="flex-direction: row; display: flex">
      <div class="row">
        <div class="col-lg-4 col-md-12 col-sm-12">
          <app-maps mapClassHeight="half-map"></app-maps>
        </div>
        <div class="col-lg-8 col-md-12 col-sm-12">
          <app-client-monitoring-requests [hideHeader]="true"></app-client-monitoring-requests>
          <app-client-checklists [hideHeader]="true"></app-client-checklists>
        </div>
      </div>
    </div>
  </div>
</nz-card>
