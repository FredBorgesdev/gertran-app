<h1 class="text-center m-b-40">
  CCG – CENTRO DE CONTROLE GERTRAN
</h1>

<img
  src="assets/images/logo/logogertran.png"
  alt="Gertran"
  class="logo"
>

<div nz-row nzGutter="16" class="m-b-20" style="min-height: 40vh;">
  <div
    nz-col
    nzSpan="12"
  >
    <nz-button-group nzSize="small" class="m-b-10">
      <button class="m-r-10" nz-button nzType="primary"
              (click)="goTo('/monitoring/monitoring-list', { 'navbar-closed': true })">
        Grid
      </button>
      <button class="m-r-10" nz-button nzType="primary"
              (click)="goTo('/reports/dashboards/maps', { fullscreen: true })">
        Mapa
      </button>
      <button
        class="m-r-10"
        nz-button
        nzType="primary"
        (click)="goTo('/monitoring-requests/monitoring-requests-list')"
      >
        SM
      </button>
      <button
        nz-button
        nzType="primary"
        (click)="goTo('/checklists/checklists-list')"
      >Checklist
      </button>
    </nz-button-group>

    <app-grid></app-grid>
  </div>

  <div
    nz-col
    nzSpan="12"
  >
    <app-maps [embed]="true"></app-maps>
  </div>
</div>

<div nz-row nzGutter="16">
  <div
    nz-col
    [nzSpan]="authService.user.hasPermission('reports.view_dashboard_checklist') ? 12 : 24"
    *ngIf="authService.user.hasPermission('reports.view_dashboard_monitoring_request')"
  >
    <app-monitoring-requests [hideHeader]="true"></app-monitoring-requests>
  </div>

  <div
    nz-col
    [nzSpan]="authService.user.hasPermission('reports.view_dashboard_monitoring_request') ? 12 : 24"
    *ngIf="authService.user.hasPermission('reports.view_dashboard_checklist')"
  >
    <app-checklists [hideHeader]="true"></app-checklists>
  </div>
</div>
