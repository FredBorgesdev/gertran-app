<div class="moldura" #contentDiv>
  <div class="dash-header">
    <div class="logo">
      <img src="assets/images/logo/logogertran.png" alt="Gertran">
    </div>

    <div class="header-content">
      <h3 class="dash-header-title">CENTRAL DE OPERAÇÕES</h3>
    </div>

    <button nz-button nzType="primary" (click)="toggleFullScreen()" class="btn-fullscreen">
      <i nz-icon [nzType]="isFullScreen ? 'compress' : 'expand'"></i>
      <span class="btn-text">{{ isFullScreen ? 'Sair' : 'Tela Cheia' }}</span>
    </button>
  </div>

  <div class="hero-content">
    <div class="logo-container">
      <img src="assets/images/logo/logogertran.png" alt="Gertran" class="big-logo">
      <div class="pulse-ring"></div>
    </div>

    <div class="text-container">
      <h1 class="company-name">GERTRAN</h1>
      <p class="company-slogan">SEGURANÇA E INTELIGÊNCIA LOGÍSTICA</p>
    </div>
  </div>

  <footer class="dash-footer">
    <div class="footer-item">
      <i nz-icon nzType="environment" nzTheme="outline"></i>
      <span>Rua dos Guajajaras, 880 - Centro, Belo Horizonte - MG</span>
    </div>
    <div class="footer-separator">|</div>
    <div class="footer-item">
      <i nz-icon nzType="phone" nzTheme="outline"></i>
      <span>(31) 3235-0991</span>
    </div>
    <div class="footer-separator">|</div>
    <div class="footer-item">
      <i nz-icon nzType="mail" nzTheme="outline"></i>
      <span>gertran@gertran.com.br</span>
    </div>
  </footer>
</div>
