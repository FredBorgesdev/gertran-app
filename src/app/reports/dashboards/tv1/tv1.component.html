<div class="moldura" #contentDiv>
  <div class="dash-header">
    <button nz-button nzType="primary" (click)="toggleFullScreen()" class="btn-fullscreen"
      [class.btn-hidden]="isFullScreen">
      <i nz-icon [nzType]="isFullScreen ? 'compress' : 'expand'"></i>
      <span class="btn-text">{{ isFullScreen ? 'Sair' : 'Tela Cheia' }}</span>
    </button>
  </div>

  <div class="hero-content">
    <div class="logo-container">
      <img src="assets/images/logo/logogertran.png" alt="Gertran" class="big-logo">
      <div class="pulse-ring"></div>
    </div>

    <div class="text-container">
      <p class="company-slogan">SEGURANÇA E INTELIGÊNCIA LOGÍSTICA</p>
    </div>
  </div>

  <footer class="dash-footer">
    <div class="footer-item main-contact">
      <i nz-icon nzType="mail" nzTheme="outline" class="icon-mail"></i>
      <span>gertran@gertran.com.br</span>
    </div>
    <div class="footer-item sub-contact">
      <i nz-icon nzType="phone" nzTheme="outline" class="icon-phone"></i>
      <span>(31) 3235-0991</span>
    </div>
  </footer>
</div>
