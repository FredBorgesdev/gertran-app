<mgl-map
  [style]="'mapbox://styles/mapbox/streets-v9'"
  [center]="mapCenter"
  [zoom]="[3]"
  [class]="embed && 'embed-map'"
>
  <mgl-marker
    *ngFor="let marker of markers; let i = index"
    [lngLat]="marker"
  >
             <span nz-icon>
               <img
                 src="assets/images/logo/truck.svg"
                 alt="Caminhão"
                 width="25px"
                 height="25px"
               />
             </span>
  </mgl-marker>
</mgl-map>
