<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  <nz-card>

    <h3>Check-list</h3>
    <div class="content">



      <!-- <h1 [class]="(hideHeader && 'header-small') + ' text-center m-b-2'">
    Check-list
  </h1> -->
      <!-- <h3 [class]="(hideHeader && 'header-small') + ' text-center m-b-20'">
    Tempo: {{ currentTime }}
    &nbsp;
    &nbsp;
    &nbsp;
    Total - {{resources?.count ?? '0'}}
  </h3> -->


      <div class="d-flex m-b-10 justify-content-between" style="align-items: center;" *ngIf="!hideHeader">
        <span>
          <div class="square bg-danger m-r-5"></div> Acima de 15 minutos
          <div class="square bg-alert m-r-5"></div> Acima de 10 minutos
          <div class="square bg-default m-r-5"></div> No prazo
        </span>
      </div>

      <nz-table #checklistTable [nzData]="resources?.results" 
        [nzFrontPagination]="false" nzSize="small"
        style="table-layout: fixed !important;" class="custom-table">
        <thead>
          <tr>
            <th class="text-center table-header" *ngFor="let column of checklistColumns" [nzWidth]="column.width">{{
              column.title }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of checklistTable.data;  let i=index" [class]="getRowClass(item)">
            <td class="text-center max-width-cell ">
              {{ item.createdAt | date: 'dd/MM HH:mm' }}
            </td>
            <td class="text-center">
              {{item.vehicle.plate}}
            </td>
            <td class="text-center ">
              {{item.vehicle?.trackers?.[0]?.trackerModel.trackerTechnology.name}}
            </td>
            <td class="text-center max-width-cell" nz-tooltip [nzTooltipTitle]="item.origin ">{{ item.origin }}</td>
            <td class="text-center max-width-cell" nz-tooltip [nzTooltipTitle]="item.destiny">{{ item.destiny }}</td>
            <td class="text-center">{{ getStatusTranslated(item.status) }}</td>
          </tr>
        </tbody>
      </nz-table>
    </div>
  </nz-card>
</nz-spin>
