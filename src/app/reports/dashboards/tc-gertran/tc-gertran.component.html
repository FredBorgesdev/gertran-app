<div class="dash-header">
  <div class="logo">
    <img src="assets/images/logo/logogertran.png" alt="Gertran">
  </div>
</div>
<div *ngIf="!mapIsSelected" style="width: 100%; height: 96vh;">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <app-alerts-page [showTitle]="false"></app-alerts-page>
    </div>
  </div>
  <nz-card>
    <div class="row">  
      <div class="col-lg-6 col-md-6 col-sm-12">
        <app-client-monitoring-requests [hideHeader]="true"></app-client-monitoring-requests>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-12">
        <app-client-checklists [hideHeader]="true"></app-client-checklists>
      </div>
    </div>
  </nz-card>  
</div>

<app-maps *ngIf="mapIsSelected"></app-maps>
