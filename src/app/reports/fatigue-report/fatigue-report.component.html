<nz-spin [nzSpinning]="isLoading">
  <nz-card>
    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="bar-chart"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        <a><i nz-icon nzType="line-chart"></i><span>Relatório de fadiga</span></a>
      </nz-breadcrumb-item>
    </nz-breadcrumb>

    <app-base-vehicle-filter
      (generateReport)="generateReport($event)"
      [rows]="fatigueReport"
      [fileName]="'Fadiga'"
    ></app-base-vehicle-filter>

    <nz-table
      #table
      [nzData]="fatigueReport"
      nzBordered
      class="m-t-50"
      [nzFrontPagination]="false"
      nzTableLayout="fixed"
    >
      <thead>
      <tr>
        <th>Data</th>
        <th>Motorista</th>
        <th>Placa</th>
        <th>Velocidade</th>
        <th>Foto</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let data of table.data; index as i">
        <td>{{ data.eventDatetime | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ data.driverName ?? '-' }}</td>
        <td>{{ data.plate ?? '-' }}</td>
        <td>{{ data.speed ?? '-' }}</td>
        <td>
          <a
            *ngIf="data.imageUrl"
            nz-tooltip
            nzTitle="Clique para ampliar"
            target="_blank"
          >
            <img
              [src]="data.imageUrl"
              alt="Foto"
              width="50"
              height="50"
              class="img-thumbnail"
            />
          </a>
        </td>
      </tr>
      </tbody>
    </nz-table>
  </nz-card>
</nz-spin>
