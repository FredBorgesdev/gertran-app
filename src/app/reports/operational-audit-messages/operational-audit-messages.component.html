<nz-spin [nzSpinning]="isLoading">
  <nz-card>
    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="bar-chart"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        <a><i nz-icon nzType="line-chart"></i><span>Auditoria Operacional Comandos</span></a>
      </nz-breadcrumb-item>
    </nz-breadcrumb>

    <app-base-user-filter
      [showCustomer]="false"
      (generateReport)="generateReport($event)"
      [rows]="commandsSentHistory"
      [fileName]="'Auditoria Operacional Mensagens'"
    ></app-base-user-filter>

    <nz-table
      #table
      [nzData]="commandsSentHistory"
      nzBordered
      class="m-t-50"
      [nzFrontPagination]="false"
      nzTableLayout="fixed"
    >
      <thead>
      <tr>
        <th>Data</th>
        <th>Placa</th>
        <th>Empresa</th>
        <th>Mensagem</th>
        <th>Usuário</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let data of table.data; index as i">
        <td>{{ data.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ data.vehicleTracker?.vehicle.plate }}</td>
        <td>{{ data.vehicleTracker?.vehicle.customers?.[0].tradingName }}</td>
        <td>{{ data.commandParams?.message }}</td>
        <td>{{ data.sentByUser?.name }}</td>
      </tr>
      </tbody>
    </nz-table>
  </nz-card>
</nz-spin>
