<form [formGroup]="validateForm" nz-form nzLayout="vertical" class="m-t-25">
  <div class="row">
    <div class="col-lg-3 col-md-12 col-sm-12 m-b-10" *ngIf="isGertranStaff">
      <nz-form-item class="m-b-0">
        <nz-form-label>Dia de fechamento</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select
            formControlName="closingDay"
            nzAllowClear
            nzPlaceHolder="Selecione um dia"
          >
            <nz-option nzLabel="10" [nzValue]="10"></nz-option>
            <nz-option nzLabel="20" [nzValue]="20"></nz-option>
            <nz-option nzLabel="30" [nzValue]="30"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
    <!--<div nz-col [nzSpan]="isGertranStaff ? 6 : 8">-->
      <nz-form-item class="m-b-0">
        <nz-form-label>Data inicial</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-date-picker
            style="width: 100%;"
            nzFormat="dd/MM/yyyy"
            formControlName="from"
            nzPlaceHolder="Selecione uma data"
          ></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
    <!--<div nz-col [nzSpan]="isGertranStaff ? 6 : 8">-->
      <nz-form-item class="m-b-0">
        <nz-form-label>Data final</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-date-picker
            style="width: 100%;"
            nzFormat="dd/MM/yyyy"
            formControlName="to"
            nzPlaceHolder="Selecione uma data"
          ></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
    <!--<div nz-col [nzSpan]="isGertranStaff ? 6 : 8">-->
      <nz-form-item class="m-b-0">
        <nz-form-label>Formato de relatório</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select formControlName="reportFormat" nzAllowClear>
            <nz-option nzLabel="Analítico" nzValue="analytic"></nz-option>
            <nz-option nzLabel="Sintético" nzValue="synthetic"></nz-option>
            <nz-option nzLabel="Ambos" nzValue="all"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</form>

<div class="page-buttons m-t-10" *ngIf="!hideButtons">
  <button nz-button class="m-l-10" (click)="generatePdf()">Gerar pdf</button>
  <button
    nz-button
    (click)="generateExcel()"
  >Gerar planilha
  </button>
  <button
    nz-button
    nzType="primary"
    (click)="emitGenerateReport()"
  >Gerar relatório
  </button>
</div>

<ng-template #selectLoading>
  <nz-spin *ngIf="selectableCustomerService.isLoadingMoreData"></nz-spin>
</ng-template>
