<form [formGroup]="validateForm" nz-form nzLayout="vertical" class="m-t-25">
  <div nz-row nzGutter="16">
    <div nz-col nzSpan="6">
      <nz-form-item class="m-b-0">
        <nz-form-label>Cliente</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select
            formControlName="customer"
            nzAllowClear
            nzPlaceHolder="Selecione um cliente"
            (ngModelChange)="loadVehicles($event)"
            nzServerSearch
            nzShowSearch
            (nzOnSearch)="selectableCustomerService.searchByName($event)"
          >
            <nz-option
              *ngFor="let customer of selectableCustomerService.customers"
              [nzLabel]="customer.tradingName"
              [nzValue]="customer.id"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="6">
      <nz-form-item class="m-b-0">
        <nz-form-label>Veiculo</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select
            formControlName="vehicle"
            nzAllowClear
            [nzDisabled]="selectableTrucksService.trucks.length === 0"
            (nzScrollToBottom)="selectableTrucksService.loadMoreTrucks()"
            [nzDropdownRender]="selectLoading"
          >
            <nz-option
              *ngFor="let vehicle of selectableTrucksService.trucks"
              [nzLabel]="vehicle.vehicle.plate"
              [nzValue]="vehicle.id"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="6">
      <nz-form-item class="m-b-0">
        <nz-form-label>Data inicial</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-date-picker
            style="width: 100%;"
            nzFormat="dd/MM/yyyy"
            formControlName="startDate"
            nzPlaceHolder="Selecione uma data"
          ></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="6">
      <nz-form-item class="m-b-0">
        <nz-form-label>Data final</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-date-picker
            style="width: 100%;"
            nzFormat="dd/MM/yyyy"
            formControlName="endDate"
            nzPlaceHolder="Selecione uma data"
          ></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</form>

<div nz-row nzGutter="16" *ngIf="!hideButtons" class="m-t-25">
  <div nz-col nzSpan="8">
    <button
      nz-button
      nzType="primary"
      style="width: 100%"
      (click)="emitGenerateReport()"
    >Gerar relatório</button>
  </div>
  <div nz-col nzSpan="8">
    <button nz-button style="width: 100%">Gerar pdf</button>
  </div>
  <div nz-col nzSpan="8">
    <button nz-button style="width: 100%">Gerar planilha</button>
  </div>
</div>

<ng-template #selectLoading>
  <nz-spin *ngIf="selectableTrucksService.isLoadingMoreData"></nz-spin>
</ng-template>
