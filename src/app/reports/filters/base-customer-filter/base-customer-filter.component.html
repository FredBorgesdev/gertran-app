<form [formGroup]="validateForm" nz-form nzLayout="vertical" class="m-t-25">
  <div class="row">
    <div class="col-lg-3 col-md-12 col-sm-12 m-b-10" *ngIf="isGertranStaff">
      <nz-form-item class="m-b-0">
        <nz-form-label>Cliente</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select
            formControlName="customer"
            nzAllowClear
            nzServerSearch
            nzShowSearch
            nzPlaceHolder="Selecione um cliente"
            (nzOnSearch)="selectableCustomerService.searchByName($event)"
            (nzScrollToBottom)="selectableCustomerService.loadMoreCustomers()"
            [nzDropdownRender]="selectLoading"
          >
            <nz-option
              *ngIf="filterByAllCustomers"
              nzLabel="Todos os clientes"
              nzValue="all"
            ></nz-option>

            <nz-option
              *ngFor="let customer of selectableCustomerService.customers"
              [nzLabel]="customer.tradingName"
              [nzValue]="customer.id"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
    <!--<div nz-col [nzSpan]="isGertranStaff ? 6 : 8">-->
      <nz-form-item class="m-b-0">
        <nz-form-label>Data inicial</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-date-picker
            style="width: 100%;"
            nzFormat="dd/MM/yyyy"
            formControlName="from"
            nzPlaceHolder="Selecione uma data"
          ></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
    <!--<div nz-col [nzSpan]="isGertranStaff ? 6 : 8">-->
      <nz-form-item class="m-b-0">
        <nz-form-label>Data final</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-date-picker
            style="width: 100%;"
            nzFormat="dd/MM/yyyy"
            formControlName="to"
            nzPlaceHolder="Selecione uma data"
          ></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-3 col-md-12 col-sm-12 m-b-10">
    <!--<div nz-col [nzSpan]="isGertranStaff ? 6 : 8">-->
      <nz-form-item class="m-b-0">
        <nz-form-label>Formato de relatório</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select formControlName="reportFormat" nzAllowClear>
            <nz-option nzLabel="Analítico" nzValue="analytic"></nz-option>
            <nz-option nzLabel="Sintético" nzValue="synthetic"></nz-option>
            <nz-option nzLabel="Ambos" nzValue="all"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>  
</form>

<div class="page-buttons m-t-10" *ngIf="!hideButtons">
      
        <button nz-button>Gerar pdf</button>
      <button
      nz-button
      (click)="generateExcel()"
    >Gerar planilha
    </button>
    <button
        nz-button
        nzType="primary"
        (click)="emitGenerateReport()"
      >Gerar relatório
      </button>
</div>

<ng-template #selectLoading>
  <nz-spin *ngIf="selectableCustomerService.isLoadingMoreData"></nz-spin>
</ng-template>
