<div nz-row nzGutter="12">
  <div nz-col nzSpan="12">
    <nz-card nzTitle="Status da frota" style="height: 30vw" [nzBodyStyle]="{ height: '100%' }">
      <canvas baseChart class="chart"
              [data]="doughnutChartData"
              [type]="'doughnut'"
              [options]="{ aspectRatio: 2, responsive: true }"
      >
      </canvas>
    </nz-card>
  </div>

  <div nz-col nzSpan="12">
    <nz-card nzTitle="Mapa" style="height: 30vw" [nzBodyStyle]="{ height: '100%' }">
      <mgl-map
        [style]="'mapbox://styles/mapbox/streets-v9'"
        [center]="mapCenter"
        [zoom]="[3]"
      >
        <mgl-marker
          *ngFor="let marker of markers; let i = index"
          [lngLat]="marker"
        >
      <span nz-icon>
        <img
          src="assets/images/logo/truck.svg"
          alt="Caminhão"
          width="25px"
          height="25px"
        />
      </span>
        </mgl-marker>
      </mgl-map>
    </nz-card>
  </div>
</div>
