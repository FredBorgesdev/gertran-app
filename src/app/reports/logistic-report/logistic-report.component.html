<nz-spin [nzSpinning]="loading" nzTip="Carregando...">
  <span nz-typography nzType="secondary">Dados dos ultimos 30 dias</span>
  <div nz-row nzGutter="16">
    <div nz-col nzSpan="8">
      <nz-card>
        <nz-statistic
          [nzTitle]="'Valor acumulado (R$)'"
          [nzValue]="(data?.totalValue | number: '1.0-0')"
          [nzPrefix]="'R$'"
          [nzValueStyle]="{ color: '#3f8600' }"
        ></nz-statistic>
      </nz-card>
    </div>

    <div nz-col nzSpan="8">
      <nz-card>
        <nz-statistic
          [nzTitle]="'Viagens Canceladas'"
          [nzValue]="data?.countByStatus.canceled?.value ?? 0"
        ></nz-statistic>
      </nz-card>
    </div>

    <div nz-col nzSpan="8">
      <nz-card>
        <nz-statistic
          [nzTitle]="'Veiculos em viagem'"
          [nzValue]="data?.countByStatus.inProgress?.value ?? 0"
        ></nz-statistic>
      </nz-card>
    </div>

    <div nz-col nzSpan="8">
      <nz-card>
        <nz-statistic
          [nzTitle]="'Veiculos em análise'"
          [nzValue]="data?.countByStatus.underReview?.value ?? 0"
        ></nz-statistic>
      </nz-card>
    </div>

    <div nz-col nzSpan="8">
      <nz-card>
        <nz-statistic
          [nzTitle]="'Veiculos aguardando inicio'"
          [nzValue]="data?.countByStatus.waitingForStart?.value ?? 0"
        ></nz-statistic>
      </nz-card>
    </div>

    <div nz-col nzSpan="8">
      <nz-card>
        <nz-statistic
          [nzTitle]="'Veiculos reprovados'"
          [nzValue]="data?.countByStatus.reproved?.value ?? 0"
        ></nz-statistic>
      </nz-card>
    </div>
  </div>


  <div nz-row nzGutter="12">
    <div nz-col nzSpan="12">
      <nz-card nzTitle="Status dos veiculos" style="height: 30vw" [nzBodyStyle]="{ height: '100%' }">
        <div *ngIf="countByTravelStatusDoughnutChart.datasets?.[0].data.length === 0">
          <span nz-typography nzType="secondary">Nenhum dado encontrado</span>
        </div>

        <canvas baseChart class="chart"
                [data]="countByTravelStatusDoughnutChart"
                [type]="'doughnut'"
                [options]="{ aspectRatio: 2, responsive: true }"
        >
        </canvas>
      </nz-card>
    </div>

    <div nz-col nzSpan="12">
      <nz-card nzTitle="Mapa" style="height: 30vw" [nzBodyStyle]="{ height: '100%' }" [nzExtra]="extraTemplate">
        <span nz-typography nzType="secondary">100 últimas posições</span>
        <mgl-map
          [style]="'mapbox://styles/mapbox/streets-v9'"
          [center]="mapCenter"
          [zoom]="[3]"
        >
          <mgl-marker
            *ngFor="let marker of markers; let i = index"
            [lngLat]="marker"
          >
            <span nz-icon>
              <img
                src="assets/images/logo/truck.svg"
                alt="Caminhão"
                width="25px"
                height="25px"
              />
            </span>
          </mgl-marker>
        </mgl-map>
      </nz-card>

      <ng-template #extraTemplate>
        <a (click)="expandMap()">Expandir</a>
      </ng-template>
    </div>
  </div>

  <div nz-row nzGutter="12">
    <div nz-col nzSpan="12">
      <nz-card nzTitle="Status SM">
        <div *ngIf="countByStatusDoughnutChart.datasets?.[0].data.length === 0">
          <span nz-typography nzType="secondary">Nenhum dado encontrado</span>
        </div>

        <canvas baseChart class="chart"
                [data]="countByStatusDoughnutChart"
                [type]="'doughnut'"
                [options]="{ aspectRatio: 2, responsive: true }"
        >
        </canvas>
      </nz-card>
    </div>

    <div nz-col nzSpan="12">
      <nz-card nzTitle="Tipo de carga">
        <div *ngIf="countByLoadTypeDoughnutChart.datasets?.[0].data.length === 0">
          <span nz-typography nzType="secondary">Nenhum dado encontrado</span>
        </div>

        <canvas baseChart class="chart"
                [data]="countByLoadTypeDoughnutChart"
                [type]="'doughnut'"
                [options]="{ aspectRatio: 2, responsive: true }"
        >
        </canvas>
      </nz-card>
    </div>
  </div>

  <div nz-row nzGutter="12">
    <div nz-col nzSpan="12">
      <nz-card nzTitle="Temperatura">
        <canvas baseChart class="chart"
                [data]="temperatureDoughnutChart"
                [type]="'doughnut'"
                [options]="{ aspectRatio: 2, responsive: true }"
        >
        </canvas>
      </nz-card>
    </div>

    <div nz-col nzSpan="12">
      <nz-card nzTitle="Percentual de veiculos por velocidade">
        <canvas baseChart class="chart"
                [data]="speedLineChart"
                [type]="'line'"
                [options]="{ aspectRatio: 2, responsive: true }"
        >
        </canvas>
      </nz-card>
    </div>
  </div>

</nz-spin>
