










<nz-spin [nzSpinning]="isLoading">
  <div class="pages-header">  
    <div class="row m-b-10">
      <div class="col-lg-12 col-md-8 col-sm-12">
        <div class="d-md-flex">
          <div class="m-r-20">
            <h2>Relatório de Clientes</h2>
          </div>
        </div>
      </div>
    </div>
  </div>  

  <nz-card>
    <!-- Filtro genérico, se necessário -->
<app-ddr-filter
    (generateReport)="generateReport($event)"
    (valueChanges)="changeValue($event)"

  ></app-ddr-filter>

    <!-- Tabela com os dados -->
    <nz-table
      #table
      [nzData]="reportData"
      nzBordered
      class="m-t-50"
      [nzFrontPagination]="false"
    >
      <thead>
        <tr>
          <th>Nome</th>
          <th>Cliente</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of table.data">
          <td>{{ item.name }}</td>
          <td>{{ item.customer?.tradingName ?? '-' }}</td>
        </tr>
      </tbody>
    </nz-table>
  </nz-card>
</nz-spin>
