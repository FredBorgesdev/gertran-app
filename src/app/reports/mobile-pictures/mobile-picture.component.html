<nz-spin [nzSpinning]="isLoading">
  
  <!--
    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="bar-chart"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        <a><i nz-icon nzType="line-chart"></i><span>Imagens de protocolo</span></a>
      </nz-breadcrumb-item>
    </nz-breadcrumb>
  -->
  <div class="pages-header">
    <div class="row m-b-10">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="d-md-flex">
          <div class="m-r-20">
            <h2>Imagens de protocolo</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nz-card>
  <app-base-workday-filter
    (valueChanges)="valueChanges($event)"
    [showExtraFields]="false"
  ></app-base-workday-filter>

    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <button
          nz-button
          (click)="getMobilePicturestoReport()"
        >Buscar protocolos
        </button>
      </div>
    </div>

    <nz-table class="m-t-20" [nzData]="protocolImages" #table>
      <thead>
        <tr>
          <th>Foto</th>
          <th>Enviado Em</th>
          <th>Latitude</th>
          <th>Longitude</th>
          <th>Observação Baixa</th>
          <th>Baixa Por</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of table.data; index as i">
          <td>
            <img [src]="'https://gertran.nyc3.digitaloceanspaces.com' + data.pictureUrl" alt="Foto" width="100" height="100" (click)="openImageModal(data.pictureUrl)" />
          </td>
          <td>{{ data.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ data.latitude }}</td>
          <td>{{ data.longitude }}</td>
          <td>{{ data.closeReason }}</td>
          <td>{{ data.closedBy?.name }}</td>
          <td>
            <button nz-button nzType="link" (click)="openGoogleMaps(data.latitude, data.longitude)">
              Ver no Google Maps
            </button>
          </td>
        </tr>
      </tbody>
    </nz-table>

    <nz-modal nzTitle="Visualização da Imagem" [(nzVisible)]="isImageModalVisible" [nzFooter]="null" (nzOnCancel)="closeImageModal()">
      <div *nzModalContent>
        <img [src]="selectedImageUrl" alt="Foto em tamanho grande" style="width: 100%;" />
      </div>
    </nz-modal>

</nz-card>
</nz-spin>
