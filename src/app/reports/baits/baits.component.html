<nz-spin [nzSpinning]="isLoading">
  <nz-card>
    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="bar-chart"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        <a><i nz-icon nzType="line-chart"></i><span>Relatório de isca</span></a>
      </nz-breadcrumb-item>
    </nz-breadcrumb>

    <app-base-customer-filter
      (generateReport)="generateReport($event)"
      [rows]="monitoringRequestsBaits"
      [fileName]="'Relatório de isca'"
    ></app-base-customer-filter>

    <nz-table
      #table
      [nzData]="monitoringRequestsBaits"
      nzBordered
      class="m-t-50"
      [nzFrontPagination]="false"
      nzTableLayout="fixed"
    >
      <thead>
      <tr>
        <th>Código</th>
        <th>Local de instalação</th>
        <th>Tecnologia</th>
        <th>Número de série</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let data of table.data; index as i">
        <td>{{ data.id | id }}</td>
        <td>{{ data.installationLocation }}</td>
        <td>{{ data.technology }}</td>
        <td>{{ data.serialNumber }}</td>
      </tr>
      </tbody>
    </nz-table>
  </nz-card>
</nz-spin>
