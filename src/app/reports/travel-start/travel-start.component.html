<nz-spin [nzSpinning]="isLoading">
  <!--
    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="bar-chart"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        <a><i nz-icon nzType="line-chart"></i><span>Inicio de viagem</span></a>
      </nz-breadcrumb-item>
    </nz-breadcrumb>
  -->
  <div class="pages-header">  
    <div class="row m-b-10">
      <div class="col-lg-12 col-md-8 col-sm-12">
        <div class="d-md-flex">
          <div class="m-r-20">
            <h2>Inicio de viagem</h2>
          </div>
        </div>
      </div>
    </div>
  </div>  
  <nz-card>  
    <app-base-vehicle-filter
      (generateReport)="generateReport($event)"
      [rows]="positionEvents"
      [filterByAllCustomers]="true"
      [fileName]="'Inicio de viagem'"
    ></app-base-vehicle-filter>

    <nz-table
      #table
      [nzData]="positionEvents"
      nzBordered
      class="m-t-50"
      [nzFrontPagination]="false"
    >
      <thead>
      <tr>
        <th>Data</th>
        <th>Placa</th>
        <th>Comando</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let data of table.data; index as i">
        <td>{{ data.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ data.position?.vehicle.plate ?? '-' }}</td>
        <td>{{ data.eventDescription }}</td>
      </tr>
      </tbody>
    </nz-table>
  </nz-card>
</nz-spin>
