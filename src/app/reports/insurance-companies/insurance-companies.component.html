<form [formGroup]="validateForm" nz-form nzLayout="vertical" class="m-t-25">
  <div nz-row nzGutter="16">
    <div nz-col nzSpan="5">
      <nz-form-item class="m-b-0">
        <nz-form-label>Cliente</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select formControlName="customer" nzAllowClear nzPlaceHolder="Selecione um cliente">
            <nz-option *ngFor="let customer of customers" [nzLabel]="customer.tradingName" [nzValue]="customer.id"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="5">
      <nz-form-item class="m-b-0">
        <nz-form-label>Seguradora</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select formControlName="insuranceCompany" nzAllowClear nzPlaceHolder="Selecione uma seguradora">
            <nz-option *ngFor="let customer of insuranceCompanies" [nzLabel]="customer.name" [nzValue]="customer.id"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="5">
      <nz-form-item class="m-b-0">
        <nz-form-label>Data inicial</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-date-picker
            style="width: 100%;"
            nzFormat="dd/MM/yyyy"
            formControlName="startDate"
            nzPlaceHolder="Selecione uma data"
          ></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="4">
      <nz-form-item class="m-b-0">
        <nz-form-label>Data final</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-date-picker
            style="width: 100%;"
            nzFormat="dd/MM/yyyy"
            formControlName="endDate"
            nzPlaceHolder="Selecione uma data"
          ></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="5">
      <nz-form-item class="m-b-0">
        <nz-form-label>Sinistro</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select formControlName="incidentType" nzAllowClear>
            <nz-option nzLabel="Furto" nzValue="theft"></nz-option>
            <nz-option nzLabel="Furto parcial" nzValue="partialTheft"></nz-option>
            <nz-option nzLabel="Roubo" nzValue="steal"></nz-option>
            <nz-option nzLabel="Tombamento" nzValue="flipOver"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</form>

<div class="page-buttons m-t-10">
    <button nz-button style="width: 100%">Gerar pdf</button>
    <button nz-button style="width: 100%">Gerar planilha</button>
    <button
      nz-button
      nzType="primary"
      style="width: 100%"
      (click)="emitGenerateReport()"
    >Gerar relatório</button>
</div>
