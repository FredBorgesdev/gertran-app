<nz-spin [nzSpinning]="isLoading">
  <nz-card>
    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="bar-chart"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        <a><i nz-icon nzType="line-chart"></i><span>Jornada de trabalho</span></a>
      </nz-breadcrumb-item>
    </nz-breadcrumb>

    <app-base-workday-filter
      (generateReport)="generateReport($event)"
      [rows]="workdayRows"
      [fileName]="'Jornada de trabalho'"
    ></app-base-workday-filter>

    <nz-table class="m-t-50" #table [nzData]="workdayRows">
      <thead>
      <tr>
        <th>Horário</th>
        <th>Status</th>
        <th>Origem</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let data of table.data; index as i">
        <td>{{ data.startedAt | date: 'dd/MM/yyyy' }}</td>
        <td>{{ data.status }}</td>
        <td>{{ data.positionEvent?.eventDescription }}</td>
      </tr>
      </tbody>
    </nz-table>
  </nz-card>
</nz-spin>
