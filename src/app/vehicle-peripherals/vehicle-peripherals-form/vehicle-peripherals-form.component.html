<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  <!--
  <nz-breadcrumb>
    <nz-breadcrumb-item>
      <i nz-icon nzType="dashboard"></i>
    </nz-breadcrumb-item>
    <nz-breadcrumb-item>
      <a><i nz-icon nzType="idcard"></i><span>Perifericos</span></a>
    </nz-breadcrumb-item>
    <nz-breadcrumb-item *ngIf="resource?.id">
      Editar Perifericos ({{resource.name}})
    </nz-breadcrumb-item>
    <nz-breadcrumb-item *ngIf="!resource?.id">
      Adicionar Perifericos
    </nz-breadcrumb-item>
  </nz-breadcrumb>
  -->
  <div class="pages-header">
    <div class="row m-b-10">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="d-md-flex">
          <div class="m-r-20">
            <h2 *ngIf="resource?.id">Editar Perifericos - {{resource.name}}</h2>
            <h2 *ngIf="!resource?.id">Adicionar Perifericos</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nz-card>
  <form nz-form nzLayout="vertical" [formGroup]="validateForm">
    <div class="row">
      <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzRequired nzFor="name">Nome</nz-form-label>
          <nz-form-control [nzSpan]="null" nzErrorTip="Insira o nome!">
            <input id="name" type="text" nz-input formControlName="name" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-control [nzSpan]="null" nzErrorTip="Insira o tipo!">
            <nz-radio-group nzName="radiogroup" formControlName="peripheralType">
              <label *ngFor="let type of peripheralTypes" nz-radio [nzValue]="type.value">{{type.label}}</label>
            </nz-radio-group>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>    
    <nz-divider></nz-divider>

    <nz-form-item>
      <nz-form-control>
        <div class="page-buttons">
          <button type="button" (click)="list()" nz-button>
            <i nz-icon nzType="unordered-list"></i>Listar Perifericos
          </button>
          <button type="button" (click)="save()" nz-button nzType="primary">
            <i nz-icon nzType="save"></i>Salvar Perifericos
          </button>
        </div>
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-card>
</nz-spin>
