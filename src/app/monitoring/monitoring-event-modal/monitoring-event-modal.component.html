<nz-table
  #table
  [nzData]="automations"
>
  <thead>
    <tr>
      <th>Data</th>
      <th>Automação</th>
      <th>Descrição</th>
      <th>Comandos enviados</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let item of table.data">
      <td>{{ item.sentAt | date: 'dd/MM/yyyy HH:mm' }}</td>
      <td>{{ getAutomationType(item.automationType) }}</td>
      <td>{{ item.description }}</td>
      <td>{{ getCommandsSent(item.commandSentHistory) }}</td>
    </tr>
</nz-table>
