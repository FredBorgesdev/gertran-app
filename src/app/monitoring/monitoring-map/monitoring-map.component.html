<nz-tabset>
  <nz-tab nzTitle="Mapa">

    <nz-card [nzCover]="map">
      <nz-list>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Tempo de viagem"
            [nzDescription]="details.travelDuration"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Saida Prevista"
            [nzDescription]="details.predictedDeparture"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Chegada Prevista"
            [nzDescription]="details.predictedArrival"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Lead time"
            [nzDescription]="details.leadTime"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Chegada calculada"
            [nzDescription]="details.calculatedArrival"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Última atualização em"
            [nzDescription]="details.lastUpdatedAt"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Tempo veículo até chegada"
            [nzDescription]="details.timeToArrival"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Distância veículo até chegada"
            [nzDescription]="details.distanceToArrival"
          ></nz-list-item-meta>
        </nz-list-item>
      </nz-list>

      <h4 class="m-t-50">Trajeto: {{details.route.id | id}}</h4>

      <nz-list>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Saída"
            [nzDescription]="details.route.departure"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Chegada"
            [nzDescription]="details.route.arrival"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Tempo até destino"
            [nzDescription]="details.route.timeToArrive"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Distância até destino"
            [nzDescription]="details.route.distanceToArrive"
          ></nz-list-item-meta>
        </nz-list-item>
        <nz-list-item>
          <nz-list-item-meta
            nzTitle="Tempo parado no destino"
            [nzDescription]="details.route.timeIdle"
          ></nz-list-item-meta>
        </nz-list-item>

      </nz-list>
    </nz-card>

    <ng-template #map>
      <google-map
        height="500px"
        width="100%"
        [center]="center"
      >
        <map-polyline
          [path]="details.path"
        ></map-polyline>
      </google-map>
    </ng-template>
  </nz-tab>
</nz-tabset>
