<nz-table
  #sharedOperationsTable
  [nzData]="sharedOperations?.results"
  [nzTotal]="sharedOperations?.count"
  [nzPageSize]="sharedOperations?.limit"
  [nzPageIndex]="page"
  [nzFrontPagination]="false"
  (nzQueryParams)="handleQueryParamsChange($event)"
>
  <thead>
  <tr>
    <th *ngFor="let column of sharedOperationsOrderColumn" [nzSortFn]="column.compare">{{ column.title }}</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let item of sharedOperationsTable.data;  let i=index">
    <td>{{item.id | id}}</td>
    <td>
      <div class="d-flex align-items-center">
        <h6 class="m-l-10 m-b-0">{{item.name}}</h6>
      </div>
    </td>
    <td>{{item.email}}</td>
    <td class="text-md-center" style="white-space: nowrap;">
      <button
        (click)="edit(item)"
        class="m-r-5"
        nz-button
        nzType="default"
      >
        <i nz-icon nzType="edit" theme="outline"></i> Editar
      </button>
      <button
      (click)="delete(item)"
      nz-button
      nzDanger
      class="m-l-10"
      nzType="default"
    >
      <i nz-icon nzType="delete" theme="outline"></i> Excluir
    </button>
    </td>
  </tr>
  </tbody>
</nz-table>
