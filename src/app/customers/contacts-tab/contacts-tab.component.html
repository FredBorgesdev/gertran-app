<div class="row m-b-30">
  <div class="col-lg-12 text-right">
    <button
      (click)="this.isCreatingContact = true"
      nz-button
      nzType="primary"
    >
      <i nz-icon nzType="plus" theme="outline"></i>
      <span> Contato</span>
    </button>
  </div>
</div>

<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  <app-contacts-table
    [contacts]="contactsDisplayData"
    (onEdit)="edit($event)"
    (onDelete)="delete($event)"
    (onPaginate)="loadContacts($event)"
  ></app-contacts-table>

  <app-contacts-form
    *ngIf="isCreatingContact"
    [contact]="contact"
    [isVisible]="isCreatingContact"
    (onClose)="this.isCreatingContact = false"
    (onSubmit)="save($event)"
  ></app-contacts-form>
</nz-spin>
