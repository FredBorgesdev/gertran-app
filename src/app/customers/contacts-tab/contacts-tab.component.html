<div class="row m-b-10">
  <div class="col-lg-8">
    <div class="d-md-flex">
      <div class="m-b-10 m-r-20">
        
      </div>
    </div>
  </div>
  <div class="col-lg-4 text-right">
    <button
      (click)="this.isCreatingContact = true"
      nz-button
      nzType="primary"
    >
      <i nz-icon nzType="plus" theme="outline"></i>
      <span> Contato</span>
    </button>      
  </div>
</div>

<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  <app-contacts-table
    [contacts]="contactsDisplayData"
    (onEdit)="edit($event)"
    (onDelete)="delete($event)"
    (onPaginate)="loadContacts($event)"
  ></app-contacts-table>

  <app-contacts-form
    *ngIf="isCreatingContact"
    [contact]="contact"
    [isVisible]="isCreatingContact"
    (onClose)="this.isCreatingContact = false"
    (onSubmit)="save($event)"
  ></app-contacts-form>
</nz-spin>
