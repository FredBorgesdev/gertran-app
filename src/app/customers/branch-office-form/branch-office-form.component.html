<nz-modal
  [(nzVisible)]="isVisible"
  nzTitle="Novo contato"
  nzWidth="600px"
  (nzOnCancel)="handleCancel()"
  (nzOnOk)="handleOk()"
>
  <ng-container *nzModalContent>
    <form nz-form nzLayout="vertical" [formGroup]="validateForm">
      <nz-form-item>
        <nz-form-label nzRequired>Razão Social</nz-form-label>
        <nz-form-control nzErrorTip="Informe a razão social">
          <input type="text" nz-input placeholder="Informe o nome do contato" formControlName="corporateName">
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzRequired>Nome Fantasia</nz-form-label>
        <nz-form-control nzErrorTip="Informe o nome fantasia">
          <input type="text" nz-input formControlName="tradingName">
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzRequired>CNPJ</nz-form-label>
        <nz-form-control nzErrorTip="CNPJ Inválido! Insira no formato 99.999.999/0001-99" >
          <input type="text" nz-input formControlName="cnpj">
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>Website</nz-form-label>
        <nz-form-control>
          <input type="url" nz-input formControlName="domain">
        </nz-form-control>
      </nz-form-item>
