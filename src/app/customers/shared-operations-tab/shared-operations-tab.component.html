<div class="row m-b-30">
  <div class="col-lg-12 text-right">
    <button
      (click)="this.isCreatingSharedOperation = true"
      nz-button
      nzType="primary"
    >
      <i nz-icon nzType="plus" theme="outline"></i>
      <span> Operação</span>
    </button>
  </div>
</div>

<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  <app-shared-operations-table
    [sharedOperations]="sharedOperationsDisplayData"
    (onEdit)="edit($event)"
    (onDelete)="delete($event)"
    (onPaginate)="loadSharedOperations($event)"
  ></app-shared-operations-table>

  <app-shared-operations-form
    *ngIf="isCreatingSharedOperation"
    [sharedOperation]="sharedOperation"
    [isVisible]="isCreatingSharedOperation"
    (onClose)="this.isCreatingSharedOperation = false"
    (onSubmit)="save($event)"
  ></app-shared-operations-form>
</nz-spin>
