<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">

  <!--
    <nz-breadcrumb>
    <nz-breadcrumb-item>
      <i nz-icon nzType="dashboard"></i>
    </nz-breadcrumb-item>
    <nz-breadcrumb-item>
      Dispositivos
    </nz-breadcrumb-item>
  </nz-breadcrumb>
  -->

  <div class="pages-header">
    <div class="row m-b-10">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="d-md-flex">
          <div class="m-r-20">
            <h2>Dispositivos</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nz-card>

    <div class="row m-b-10">
      <div class="col-lg-4 col-md-6 col-sm-12">
        <nz-input-group [nzPrefix]="prefixTemplate">
          <input type="text" nz-input placeholder="Buscar Dispositivo" [(ngModel)]="searchInput"
            (ngModelChange)="search()">
        </nz-input-group>
        <ng-template #prefixTemplate>
          <i nz-icon nzType="search" class="opacity-05"></i>
        </ng-template>
      </div>
    </div>
    <nz-table #personalMonitoringListTable [nzData]="resources?.results" [nzTotal]="resources?.count"
      [nzPageSize]="resources?.limit" [nzPageIndex]="page" [nzFrontPagination]="false"
      (nzQueryParams)="handleQueryParamsChange($event)">
      <thead>
        <tr>
          <th *ngFor="let column of personalMonitoringColumns" [nzSortFn]="column.compare">{{ column.title }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of personalMonitoringListTable.data;  let i=index">
          <td>{{item.id}}</td>
          <td>{{ item?.user?.name || ' ' }}</td>
          <td>{{item.pkId}}</td>
          <td class="text-md-center" style="white-space: nowrap;">
            <button (click)="edit(item)" nz-button nzType="default">
              <i nz-icon nzType="edit" theme="outline"></i> Editar
            </button>
            <button nz-button nzType="default" nzDanger class="m-l-10" (click)="delete(item)">
              <i nz-icon nzType="delete" theme="outline"></i> Excluir
            </button>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </nz-card>

</nz-spin>
