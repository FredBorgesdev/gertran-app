<nz-spin [nzSpinning]="isLoading">

<div class="pages-header">  
  <div class="row m-b-10">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="d-md-flex">
        <div class="m-r-20">
          <h2>Vencimento checklist</h2>
        </div>
      </div>
    </div>
  </div>
</div>  


<nz-table
  [nzData]="checklists"
  [nzBordered]="true"
  [nzSize]="'small'"
  [nzFrontPagination]="false"

>
  <thead>
    <tr>
      <th>Veiculo</th>
      <th>Avaliado em</th>
      <th>Expirado em</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of checklists">
      <td>{{ item.vehicle?.plate }}</td>
      <td>{{ item.reviewedAt | date: 'dd/MM/yyyy HH:mm' }}</td>
      <td>{{ item.expirationDate | date: 'dd/MM/yyyy HH:mm' }}</td>
    </tr>
  </tbody>
</nz-table>
</nz-spin>
