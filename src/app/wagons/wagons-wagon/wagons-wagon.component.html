<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">

    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="dashboard"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        <a><i nz-icon nzType="idcard"></i><span>Carretas</span></a>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item *ngIf="wagon?.id">
        Editar Carreta ({{ wagon?.vehicle.plate }})
      </nz-breadcrumb-item>
      <nz-breadcrumb-item *ngIf="!wagon?.id">

      </nz-breadcrumb-item>

    <div class="pages-header m-b-25">
      <div class="row m-b-10">
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="d-md-flex">
            <div class="m-r-20">
              <h2 *ngIf="wagon?.id">Editar Carreta - {{ wagon?.vehicle.plate }}</h2>
              <h2 *ngIf="!wagon?.id">Adicionar Carreta</h2>
            </div>
          </div>
        </div>
      </div>
    </div>
    <nz-card>
    <nz-tabset>
      <nz-tab nzTitle="Carreta">
        <app-wagons-form
          [wagon]="wagon"
          *ngIf="!isLoading"
        ></app-wagons-form>
      </nz-tab>

      <nz-tab nzTitle="Rastreadores" [nzDisabled]="!wagon?.id">
        <app-trackers-tab
          *ngIf="wagon?.id"
          [vehicleId]="wagon?.vehicle.id"
        ></app-trackers-tab>
      </nz-tab>
    </nz-tabset>

  </nz-card>
</nz-spin>
