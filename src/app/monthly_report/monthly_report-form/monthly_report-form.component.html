<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">

<div class="pages-header">
  <div class="row m-b-10">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="d-md-flex">
        <div class="m-r-20">
          <h2 *ngIf="item?.id">Editar monthly_report - {{item?.tradingName}}</h2>
          <h2 *ngIf="!item?.id">Adicionar monthly_report</h2>
        </div>
      </div>
    </div>
  </div>
</div>
<nz-card>
  
  <form nz-form nzLayout="vertical" [formGroup]="validateForm">
    <div class="row">
      <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="tradingName">Razão social</nz-form-label>
          <nz-form-control nzErrorTip="Insira a razão social">
            <input id="tradingName" nz-input formControlName="tradingName" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="cnpj">CNPJ</nz-form-label>
          <nz-form-control nzErrorTip="Insira o CNPJ">
            <input id="cnpj" nz-input formControlName="cnpj" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="startCoverage">Início da vigência</nz-form-label>
          <nz-form-control nzErrorTip="Insira a data de início">
            <nz-date-picker
              id="startCoverage"
              formControlName="startCoverage"
              nzFormat="yyyy-MM-dd"
              [nzShowTime]="false">
            </nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="endCoverage">Fim da vigência</nz-form-label>
          <nz-form-control nzErrorTip="Insira a data de fim">
            <nz-date-picker
              id="endCoverage"
              formControlName="endCoverage"
              nzFormat="yyyy-MM-dd"
              [nzShowTime]="false">
            </nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="col-lg-3 col-md-6 col-sm-12 m-b-10">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="broker">Corretor</nz-form-label>
          <nz-form-control nzErrorTip="Insira o nome do corretor">
            <input id="broker" nz-input formControlName="broker" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="col-lg-6 col-md-12">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzFor="insuranceCompany">Seguradora ou corretora?</nz-form-label>
          <nz-form-control [nzSpan]="null">
            <nz-select
              id="insuranceCompany"
              nzShowSearch
              nzAllowClear
              nzPlaceHolder="Seguradora"
              formControlName="insuranceCompany"
            >
              <div *ngFor="let insuranceCompany of insuranceCompanies">
                <nz-option
                  [nzLabel]="insuranceCompany.name"
                  [nzValue]="insuranceCompany.id"
                ></nz-option>
              </div>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <nz-divider></nz-divider>

    <nz-form-item>
      <nz-form-control>
        <div class="page-buttons">
          <button type="button" (click)="navigateToList()" nz-button>
            <i nz-icon nzType="unordered-list"></i>Listar MonthlyReport
          </button>
          <button type="button" (click)="save()" nz-button nzType="primary">
            <i nz-icon nzType="save"></i>Salvar MonthlyReport
          </button>
        </div>
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-card>
</nz-spin>
