<div class="pages-header">
  <div class="row m-b-10">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="d-md-flex">
        <div class="m-r-20">
          <h2 *ngIf="vehicleManufacturers?.id">Editar Construtoras - {{vehicleManufacturers.name}}</h2>
          <h2 *ngIf="!vehicleManufacturers?.id">Adicionar Construtoras</h2>
        </div>
      </div>
    </div>
  </div>
</div>
<nz-card>
  <nz-tabset>
    <nz-tab nzTitle="Montadora">
      <form nz-form nzLayout="vertical" [formGroup]="validateForm">
        <div class="row">
          <div class="col-lg-4 col-md-12 col-sm-12 m-b-10">
            <nz-form-item>
              <nz-form-label [nzSpan]="null" nzRequired nzFor="name">Nome</nz-form-label>
              <nz-form-control [nzSpan]="null" nzErrorTip="Insira o nome!">
                <input id="name" type="text" nz-input formControlName="name" />
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">  
            <nz-form-item>
              <nz-form-label nzFor="Trucks">Faz caminhões?</nz-form-label>
              <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
                <div nz-col [nzSpan]="12">
                  <label nz-checkbox formControlName="makesTrucks">Sim</label>
                </div>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">  
            <nz-form-item>
              <nz-form-label nzFor="Wagons">Faz carretas?</nz-form-label>
              <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
                <div nz-col [nzSpan]="12">
                  <label nz-checkbox formControlName="makesWagons">Sim</label>
                </div>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>    
        
        <nz-divider></nz-divider>

        <nz-form-item>
          <nz-form-control>
            <div class="page-buttons">
              <button type="button" (click)="list()" nz-button>
                <i nz-icon nzType="unordered-list"></i>Listar Construtoras
              </button>
              <button type="button" (click)="save()" nz-button nzType="primary">
                <i nz-icon nzType="save"></i>Salvar Construtoras
              </button>
          </div>
          </nz-form-control>
        </nz-form-item>
      </form>
    </nz-tab>
    
    <nz-tab nzTitle="Modelos" [nzDisabled]="!vehicleManufacturers?.id">
      <app-vehicle-models-list
        *ngIf="vehicleManufacturers?.id"
        [vehicleManufacturer]="vehicleManufacturers"
      ></app-vehicle-models-list>
    </nz-tab>
  </nz-tabset>
</nz-card>
</nz-spin>
