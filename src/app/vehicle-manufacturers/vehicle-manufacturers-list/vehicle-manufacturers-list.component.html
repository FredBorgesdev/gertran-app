<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">

  <!--
  <nz-breadcrumb>
    <nz-breadcrumb-item>
      <i nz-icon nzType="dashboard"></i>
    </nz-breadcrumb-item>
    <nz-breadcrumb-item>
      Construtoras
    </nz-breadcrumb-item>
  </nz-breadcrumb>
  -->
  <div class="pages-header">
    <div class="row m-b-10">
      <div class="col-lg-8 col-md-8 col-sm-12">
        <div class="d-md-flex">
          <div class="m-r-20">
            <h2>Construtoras</h2>
          </div>
        </div>
      </div>
      <div class="col-lg-4 col-md-4 col-sm-12 pages-header-button">
        <button
          (click)="create()"
          nz-button
          nzType="primary"
        >
          <i nz-icon nzType="plus" theme="outline"></i>
          <span>Adicionar Construtoras</span>
        </button>
      </div>
    </div>
  </div>
  <nz-card>
  
  <nz-table
    #table
    [nzData]="resources?.results"
    [nzTotal]="resources?.count"
    [nzPageSize]="resources?.limit"
    [nzPageIndex]="page"
    [nzFrontPagination]="false"
    (nzQueryParams)="handleQueryParamsChange($event)"
  >
    <thead>
    <tr>
      <th *ngFor="let column of vehicleManufacturersColumns" [nzSortFn]="column.compare">{{ column.title }}</th>
    </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of table.data; let i=index">
        <td>{{item.id | id}}</td>
        <td>
          <div class="d-flex align-items-center">
            <h6 class="m-l-10 m-b-0">{{item.name}}</h6>
          </div>
        </td>
        <td>
          <nz-badge *ngIf="item.makesTrucks" nzStatus="success"></nz-badge>
          <nz-badge *ngIf="!item.makesTrucks" nzStatus="error"></nz-badge>
        </td>
        <td>
          <nz-badge *ngIf="item.makesWagons" nzStatus="success"></nz-badge>
          <nz-badge *ngIf="!item.makesWagons" nzStatus="error"></nz-badge>
        </td>
        <td class="text-md-center d-flex" style="white-space: nowrap;">
          <button
            (click)="edit(item)"
            nz-button
            nzType="default"
          >
            <i nz-icon nzType="edit" theme="outline"></i> Editar
          </button>
          <button
            nz-button
            nzType="default"
            nzDanger
            (click)="delete(item)"
            class="m-l-10"
          >
            <i nz-icon nzType="delete" theme="outline"></i> Excluir
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>

</nz-spin>
