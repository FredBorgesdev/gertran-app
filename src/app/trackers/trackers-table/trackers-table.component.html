<nz-table #trackersTable [nzData]="trackers" >
  <thead>
  <tr>
    <th *ngFor="let column of trackersOrderColumn" [nzSortFn]="column.compare">{{ column.title }}</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let item of trackersTable.data;  let i=index">
    <td>#{{item.id}}</td>
    <td>
      <div class="d-flex align-items-center">
        <h6 class="m-l-10 m-b-0">{{item.trackingSystem}}</h6>
      </div>
    </td>
    <td>{{item.trackingModel}}</td>
    <td>{{item.trackingSerialNumber}}</td>
    <td class="text-md-center">
      <nz-badge *ngIf="item.main" nzStatus="success"></nz-badge>
      <nz-badge *ngIf="!item.main" nzStatus="error"></nz-badge>
    </td>
    <td class="text-md-center">
      <a
        *ngIf="!item.main"
        (click)="trackersEdit(item)"
        class="m-r-5"
        nz-button
        nzType="default"
        nzShape="circle"
        nz-tooltip
        nzTooltipTitle="Tornar contato principal"
      >
        <i
          nz-icon
          nzType="star"
          theme="outline"
        ></i>
      </a>
      <a
        (click)="editTracker(item)"
        class="m-r-5"
        nz-button
        nzType="default"
        nzShape="circle"
        nz-tooltip
        nzTooltipTitle="Editar"
      >
        <i nz-icon nzType="edit" theme="outline"></i>
      </a><a
      (click)="trackersEdit(item)"
      nz-button
      nzType="default"
      nzShape="circle"
      nz-tooltip
      nzTooltipTitle="Excluir"
    >
      <i nz-icon nzType="delete" theme="outline"></i>
    </a>
    </td>
  </tr>
  </tbody>
</nz-table>
