<div class="row m-b-30">
  <div class="col-lg-12 text-right">
    <button
      (click)="this.isCreatingDocument = true"
      nz-button
      nzType="primary"
    >
      <i nz-icon nzType="plus" theme="outline"></i>
      <span>Adicionar Documento</span>
    </button>
  </div>
</div>

<app-documents-table
  [documents]="documents"
  (onEdit)="edit($event)"
  (onDelete)="delete($event)"
></app-documents-table>

<app-documents-form
  *ngIf="isCreatingDocument"
  [document]="document"
  [isVisible]="isCreatingDocument"
  (onCancel)="this.isCreatingDocument = false"
  (onSubmit)="save($event)"
></app-documents-form>
