<div class="row m-b-10">
  <div class="col-lg-8">
    <div class="d-md-flex">
      <div class="m-b-10 m-r-20">
        
      </div>
    </div>
  </div>
  <div class="col-lg-4 text-right">
    <button
      (click)="this.isCreatingDocument = true"
      nz-button
      nzType="primary"
    >
      <i nz-icon nzType="plus" theme="outline"></i>
      <span>Adicionar Documento</span>
    </button>      
  </div>
</div>

<app-documents-table
  [documents]="documents"
  (onEdit)="edit($event)"
  (onDelete)="delete($event)"
></app-documents-table>

<app-documents-form
  *ngIf="isCreatingDocument"
  [document]="document"
  [isVisible]="isCreatingDocument"
  (onCancel)="this.isCreatingDocument = false"
  (onSubmit)="save($event)"
></app-documents-form>
