<div class="pages-header">
  <div class="row m-b-10">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="d-md-flex">
        <div class="m-r-20">
          <h2 *ngIf="insuranceCompany?.id">Editar seguradora - {{insuranceCompany?.name}}</h2>
          <h2 *ngIf="!insuranceCompany?.id">Adicionar seguradora</h2>
        </div>
      </div>
    </div>
  </div>
</div>
<nz-card> 
  <form nz-form nzLayout="vertical" [formGroup]="validateForm">
    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzRequired nzFor="name">Nome</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="Insira o nome!">
        <input id="name" type="text" nz-input formControlName="name"/>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzRequired nzFor="phone">Telefone</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="Insira o telefone!">
        <input id="phone" type="text" nz-input formControlName="phone"/>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzFor="email">Email</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="inválido!">
        <input id="email" type="email" formControlName="email" nz-input/>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzFor="website">Website</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="inválido!">
        <input id="website" type="url" formControlName="website" nz-input/>
      </nz-form-control>
    </nz-form-item>

    <nz-upload
      nzDisabled
      nzType="drag"
      [nzMultiple]="false"
      nzAction="https://www.mocky.io/v2/5cc8019d300000980a055e76"
    >
      <p class="ant-upload-drag-icon">
        <i nz-icon nzType="inbox"></i>
      </p>
      <p class="ant-upload-text">Solte o arquivo com a logo da empresa</p>
      <p class="ant-upload-hint">
        Permitido apenas arquivos de imagem. Somente arquivos de até 5MB. Apenas um arquivo.
      </p>
    </nz-upload>

    <nz-divider></nz-divider>

    <nz-form-item>
      <nz-form-control [nzOffset]="7" [nzSpan]="12">
        <button type="button" (click)="save()" nz-button nzType="primary">
          <i nz-icon nzType="save"></i>Salvar seguradora
        </button>
        <button type="button" (click)="listInsuranceCompanies()" nz-button>
          <i nz-icon nzType="unordered-list"></i>Listar Seguradoras
        </button>
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-card>
</nz-spin>
