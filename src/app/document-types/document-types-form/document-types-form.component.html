<div class="pages-header">
  <div class="row m-b-10">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="d-md-flex">
        <div class="m-r-20">
          <h2>Adicionar tipo de documento</h2>
        </div>
      </div>
    </div>
  </div>
</div>
<nz-card>
  <form nz-form nzLayout="vertical" [formGroup]="validateForm">
    <div class="row">
      <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzRequired nzFor="name">Nome</nz-form-label>
          <nz-form-control [nzSpan]="null" nzErrorTip="Insira o nome!">
            <input id="name" type="text" nz-input formControlName="name" />
          </nz-form-control>
        </nz-form-item>
      </div>  
    </div>  
    <nz-divider></nz-divider>

    <nz-form-item>
      <nz-form-control>
        <div class="page-buttons">
          <button type="button" (click)="listDocumentTypes()" nz-button>
            <i nz-icon nzType="unordered-list"></i>Listar Tipos de documentos
          </button>
          <button type="button" (click)="save()" nz-button nzType="primary">
            <i nz-icon nzType="save"></i>Salvar tipo de documento
          </button>
        </div>  
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-card>
</nz-spin>
