<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">

  <nz-card>

    <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="dashboard"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        Motoristas
      </nz-breadcrumb-item>
    </nz-breadcrumb>

    <nz-divider></nz-divider>

    <div class="row m-b-30">
      <div class="col-lg-8">
        <div class="d-md-flex">
          <div class="m-b-10 m-r-20">
            <nz-input-group [nzPrefix]="prefixTemplate">
              <input type="text" nz-input placeholder="Buscar Motorista" [(ngModel)]="searchInput" (ngModelChange)="search()">
            </nz-input-group>
            <ng-template #prefixTemplate>
              <i nz-icon nzType="search" class="opacity-05"></i>
            </ng-template>
          </div>
        </div>
      </div>
      <div class="col-lg-4 text-right">
        <button
          (click)="create()"
          nz-button
          nzType="primary"
        >
          <i nz-icon nzType="plus" theme="outline"></i>
          <span>Adicionar Motorista</span>
        </button>
      </div>
    </div>
    <nz-table #driversListTable [nzData]="displayData" >
      <thead>
      <tr>
        <th *ngFor="let column of driverColumn" [nzSortFn]="column.compare">{{ column.title }}</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let item of driversListTable.data;  let i=index">
        <td>
          <div class="d-flex align-items-center">
            <nz-avatar [nzSize]="30" nzIcon="user" [nzSrc]="item.profilePhoto"></nz-avatar>
            <h6 class="m-l-10 m-b-0">{{item.name}}</h6>
          </div>
        </td>
        <td>{{item.cpf}}</td>
        <td>{{item.cnhNumber}}</td>
        <td>{{item.cnhCategory}}</td>
        <td>{{item.cnhValidity | date: 'dd/MM/yyyy'}}</td>
        <td class="text-md-center">
          <a
            (click)="edit(item)"
            class="m-r-5"
            nz-button
            nzType="default"
            nzShape="circle"
            nz-tooltip
            nzTooltipTitle="Editar"
          >
            <i nz-icon nzType="edit" theme="outline"></i>
          </a>
          <button nz-button nzType="default" nzShape="circle" nz-tooltip nzTooltipTitle="Excluir">
            <i nz-icon nzType="delete" theme="outline"></i>
          </button>
        </td>
      </tr>
      </tbody>
    </nz-table>
  </nz-card>

</nz-spin>
