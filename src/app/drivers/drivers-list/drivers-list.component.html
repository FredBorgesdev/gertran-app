<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">

  <nz-breadcrumb>
      <nz-breadcrumb-item>
        <i nz-icon nzType="dashboard"></i>
      </nz-breadcrumb-item>
      <nz-breadcrumb-item>
        Motoristas
      </nz-breadcrumb-item>
    </nz-breadcrumb>
  -->

<div *ngIf="authService.customerId"></div>
<div class="pages-header" *ngIf="showHeader">  
  <div class="row m-b-10">
    <div class="col-lg-8 col-md-8 col-sm-12">
      <div class="d-md-flex">
        <div class="m-r-20">
          <h2>Motoristas</h2>
        </div>
      </div>
    </div>
    <div class="col-lg-4 col-md-4 col-sm-12 pages-header-button">
      <button
        (click)="create()"
        nz-button
        nzType="primary"
      >
        <i nz-icon nzType="plus" theme="outline"></i>
        <span>Adicionar Motorista</span>
      </button>
    </div>
  </div>
</div>  

<nz-card>  
  <div class="row m-b-10">
    <div class="col-lg-8">
      <div class="d-md-flex">
        <div class="m-b-10">
          <nz-input-group [nzPrefix]="prefixTemplate">
            <input
              type="text"
              nz-input
              placeholder="Buscar Motorista"
              [(ngModel)]="searchInput"
              (ngModelChange)="search()"
            >
          </nz-input-group>
          <ng-template #prefixTemplate>
            <i nz-icon nzType="search" class="opacity-05"></i>
          </ng-template>
        </div>
      </div>
    </div>
    <div class="col-lg-4 text-right" *ngIf="authService.user.hasPermission('users.add_baseuser') && !showHeader">
      <button
        (click)="create()"
        nz-button
        nzType="primary"
      >
        <i nz-icon nzType="plus" theme="outline"></i>
        <span>Adicionar Motorista</span>
      </button>
    </div>
  </div>

  <nz-table
    #driversListTable
    [nzData]="resources?.results"
    [nzTotal]="resources?.count"
    [nzPageSize]="resources?.limit"
    [nzPageIndex]="page"
    [nzFrontPagination]="false"
    (nzQueryParams)="handleQueryParamsChange($event)"
  >
    <thead>
    <tr>
      <th *ngFor="let column of driverColumn" [nzSortFn]="column.compare">{{ column.title }}</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of driversListTable.data;  let i=index">
      <td>{{item.id | id}}</td>
      <td>
        <div class="d-flex align-items-center">
          <nz-avatar [nzSize]="32" nzIcon="user" [nzSrc]="item.profilePhoto"></nz-avatar>
          <h6 class="m-l-10 m-b-0">{{item.name}}</h6>
        </div>
      </td>
      <td>{{item.cpf}}</td>
      <td>{{item.cnhNumber}}</td>
      <td>{{item.cnhCategory}}</td>
      <td>{{item.cnhValidity | date: 'dd/MM/yyyy'}}</td>
      <td class="text-md-center d-flex" style="white-space: nowrap;">
        <button
        (click)="edit(item)"
          nz-button
          nzType="default"
      >
        <i nz-icon nzType="edit" theme="outline"></i> Editar
      </button>
      <button
        (click)="delete(item)"
        nz-button
        nzDanger
        nzType="default"
        class="m-l-10"
        >
        <i nz-icon nzType="delete" theme="outline"></i> Excluir
      </button>  
      </td>
    </tr>
    </tbody>
  </nz-table>
</nz-card>

</nz-spin>
