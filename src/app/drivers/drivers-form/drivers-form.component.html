<form nz-form nzLayout="vertical" [formGroup]="validateForm">
  <nz-form-item *ngIf="!authService.customerId">
    <nz-form-label [nzSpan]="null" nzRequired nzFor="customers">Empresas</nz-form-label>
    <nz-form-control [nzSpan]="null" nzErrorTip="Empresa inválida!">
      <nz-select
        id="customers"
        nzShowSearch
        nzAllowClear
        nzPlaceHolder="Selecione uma empresa"
        formControlName="customers"
        nzMode="multiple"
        nzServerSearch
        (nzOnSearch)="selectableCustomerService.searchByName($event)"
        (nzScrollToBottom)="selectableCustomerService.loadMoreCustomers()"
        [nzDropdownRender]="selectLoading"
      >
        <nz-option *ngFor="let customer of selectableCustomerService.customers" [nzLabel]="customer.tradingName"
                   [nzValue]="customer.id"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <div nz-row nzGutter="16" nzAlign="middle">
      <div nz-col nzSpan="18">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzRequired nzFor="cpf">CPF</nz-form-label>
          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o CPF no formato 999.999.999-99">
            <input
              [textMask]="{ mask: cpfMask, guide: false }"
              id="cpf"
              type="text"
              nz-input
              formControlName="cpf"
            />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="6">
        <button
          nz-button
          nzType="primary"
          (click)="filterDriverByCpf()"
        >Buscar
        </button>
      </div>
    </div>
  </nz-form-item>
  <nz-form-item>
    <nz-form-label [nzSpan]="null" nzRequired nzFor="workingSituation">Situação funcional</nz-form-label>
    <nz-form-control [nzSpan]="null" nzErrorTip="Opção inválida!">
      <nz-select
        id="workingSituation"
        nzPlaceHolder="Selecione uma opção"
        formControlName="workingSituation"
      >
        <nz-option
          *ngFor="let workingSituation of workingSituations"
          [nzLabel]="workingSituation.label"
          [nzValue]="workingSituation.value"
        ></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-label [nzSpan]="null" nzRequired nzFor="name">Nome</nz-form-label>
    <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o nome">
      <input id="name" type="text" nz-input formControlName="name"/>
    </nz-form-control>
  </nz-form-item>

  <div nz-row nzGutter="16">
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzRequired nzFor="rg">RG</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o RG no formato 99.999.999-99">
          <input id="rg" type="text" nz-input formControlName="rg"/>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzRequired nzFor="phoneNumber">Telefone</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
          <input
            id="phoneNumber"
            type="text"
            nz-input
            formControlName="phoneNumber"
            [textMask]="{ mask: phoneNumberMask, guide: false }"
          />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <nz-form-item>
    <nz-form-label [nzRequired]="validateForm.value.workingSituation === 'working'" nzFor="admissionDate">Data de
      admissão
    </nz-form-label>
    <nz-form-control nzErrorTip="Data inválida!">
      <nz-date-picker style="width: 100%;" id="admissionDate" nzFormat="dd/MM/yyyy"
                      formControlName="admissionDate"></nz-date-picker>
    </nz-form-control>
  </nz-form-item>
  <div nz-row nzGutter="16">
    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzRequired nzFor="cnhNumber">CNH</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="inválido!">
          <input id="cnhNumber" type="text" formControlName="cnhNumber" nz-input/>
        </nz-form-control>
      </nz-form-item>
    </div>

    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzRequired nzFor="cnhCategory">CNH Categoria</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="inválido!">
          <nz-select id="cnhCategory" formControlName="cnhCategory" nz-select>
            <nz-option nzLabel="A" nzValue="A"></nz-option>
            <nz-option nzLabel="B" nzValue="B"></nz-option>
            <nz-option nzLabel="AB" nzValue="AB"></nz-option>
            <nz-option nzLabel="C" nzValue="C"></nz-option>
            <nz-option nzLabel="D" nzValue="D"></nz-option>
            <nz-option nzLabel="E" nzValue="E"></nz-option>
            <nz-option nzLabel="AE" nzValue="AE"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>

    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzRequired nzFor="cnhValidity">CNH Validade</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="inválido!">
          <nz-date-picker style="width: 100%;" id="cnhValidity" nzFormat="dd/MM/yyyy"
                          formControlName="cnhValidity"></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>


  <div nz-row nzGutter="16">
    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="cnhEmission">CNH Emissão</nz-form-label>
        <nz-form-control nzErrorTip="Data inválida!">
          <nz-date-picker style="width: 100%;" id="cnhEmission" nzFormat="dd/MM/yyyy"
                          formControlName="cnhEmission"></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>

    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="cnhFirstIssue">CNH Primeira Emissão</nz-form-label>
        <nz-form-control nzErrorTip="Data inválida!">
          <nz-date-picker style="width: 100%;" id="cnhFirstIssue" nzFormat="dd/MM/yyyy"
                          formControlName="cnhFirstIssue"></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>

    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzFor="cnhIssuerUf">CNH Orgão emissor UF</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o estado">
          <nz-select
            nzAllowClear
            nzPlaceHolder="Selecione um estado"
            nzShowSearch
            formControlName="cnhIssuerUf"
          >
            <nz-option
              *ngFor="let state of states"
              [nzLabel]="state.name"
              [nzValue]="state.abbreviation"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

    <a
    nz-button
    nzType="link"
    class="m-b-50"
    (click)="isChangePasswordModalVisible = true"
    *ngIf="driver?.id"
  >Trocar senha</a>

  <nz-form-item>
    <nz-form-control [nzOffset]="7" [nzSpan]="12">
      <button type="button" (click)="save()" nz-button nzType="primary">
        <i nz-icon nzType="save"></i>Salvar Motorista
      </button>
      <button type="button" (click)="backToCustomerList()" nz-button>
        <i class="fas fa-arrow-left"></i> Voltar
      </button>
    </nz-form-control>
  </nz-form-item>
</form>






<nz-modal
  [(nzVisible)]="isChangePasswordModalVisible"
  nzTitle="Trocar senha"
  (nzOnCancel)="isChangePasswordModalVisible = false"
>
  <div *nzModalContent>
    <form nzLayout="vertical" nz-form [formGroup]="validatePasswordForm">
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzRequired nzFor="password">Senha</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo com no mínimo 6 caracteres">
          <input id="password" type="password" nz-input formControlName="password" />
        </nz-form-control>
      </nz-form-item>
    </form>
  </div>

  <div *nzModalFooter>
    <button
      nz-button
      nzType="default"
      (click)="isChangePasswordModalVisible = false"
    >Fechar</button>
    <button
      nz-button
      nzType="primary"
      (click)="submitPassword()"
    >Enviar</button>
  </div>
</nz-modal>




<ng-template #selectLoading>
  <nz-spin *ngIf="selectableCustomerService.isLoadingMoreData"></nz-spin>
</ng-template>
