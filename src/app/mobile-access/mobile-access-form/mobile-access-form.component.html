<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">

  <div class="pages-header">
    <div class="row m-b-10">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="d-md-flex">
          <div class="m-r-20">
            <h2 *ngIf="item?.id">Editar Acesso Mobile - {{item?.tradingName}}</h2>
            <h2 *ngIf="!item?.id">Adicionar Acesso Mobile</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nz-card>
    <form nz-form nzLayout="vertical" [formGroup]="validateForm">
      <div class="row">

        <!-- Usuário -->
        <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">

          <nz-form-item class="m-b-0">
            <nz-form-label>Cliente</nz-form-label>
            <nz-form-control nzErrorTip="Preencha o campo">
              <nz-select formControlName="customer" nzAllowClear nzServerSearch nzShowSearch
                nzPlaceHolder="Selecione um cliente" (nzOnSearch)="searchCustomer($event)"
                (ngModelChange)="selectableUsersService.loadMoreUsers($event)" (nzScrollToBottom)="loadMoreCustomers()">
                <nz-option *ngFor="let customer of customers" [nzLabel]="customer.tradingName"
                  [nzValue]="customer.id"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Cliente -->
        <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">
          <nz-form-item>
            <nz-form-label [nzSpan]="null" nzFor="user">Usuários</nz-form-label>
            <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
              <nz-select id="user" nzShowSearch nzAllowClear nzPlaceHolder="Selecione um usuário" formControlName="user"
                nzServerSearch (nzOnSearch)="selectableUsersService.searchByName($event)"
                (nzScrollToBottom)="selectableUsersService.loadMoreUsers()">
                <nz-option *ngFor="let user of selectableUsersService.users" [nzLabel]="user.name"
                  [nzValue]="user.id"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Grupo de acesso -->
        <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">
          <nz-form-item>
            <nz-form-label nzFor="group_mobile_access" nzRequired>Grupo de acesso</nz-form-label>
            <nz-form-control nzErrorTip="Selecione o grupo">
              <nz-select formControlName="group_mobile_access" nzPlaceHolder="Selecione o grupo de acesso">
                <nz-option *ngFor="let group of groupAccessList" [nzValue]="group.id"
                  [nzLabel]="group.name"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Tipo de cobrança -->
        <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">
          <nz-form-item>
            <nz-form-label nzFor="choise_charge_type" nzRequired>Tipo de cobrança</nz-form-label>
            <nz-form-control nzErrorTip="Selecione o tipo">
              <nz-select formControlName="choise_charge_type" nzPlaceHolder="Selecione">
                <nz-option nzValue="period" nzLabel="Por período"></nz-option>
                <nz-option nzValue="per_service" nzLabel="Por Serivço"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Início -->
        <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">
          <nz-form-item>
            <nz-form-label nzFor="startAt" nzRequired>Início</nz-form-label>
            <nz-form-control nzErrorTip="Insira a data de início">
              <nz-date-picker formControlName="startAt" nzFormat="dd/MM/yyyy" nzPlaceHolder="Data de início">
              </nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Fim -->
        <div class="col-lg-4 col-md-6 col-sm-12 m-b-10">
          <nz-form-item>
            <nz-form-label nzFor="endAt" nzRequired>Fim</nz-form-label>
            <nz-form-control nzErrorTip="Insira a data de fim">
              <nz-date-picker formControlName="endAt" nzFormat="dd/MM/yyyy" nzPlaceHolder="Data de fim">
              </nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Botões -->
        <div class="col-12">
          <nz-divider></nz-divider>
          <nz-form-item>
            <nz-form-control>
              <div class="page-buttons">
                <button type="button" (click)="navigateToList()" nz-button>
                  <i nz-icon nzType="unordered-list"></i> Listar
                </button>
                <button type="button" (click)="save()" nz-button nzType="primary">
                  <i nz-icon nzType="save"></i> Salvar
                </button>
              </div>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </form>
  </nz-card>

</nz-spin>
