<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">

<div class="pages-header">
  <div class="row m-b-10">
    <div class="col-lg-8 col-md-8 col-sm-12">
      <div class="d-md-flex">
        <div class="m-r-20">
          <h2>Acesso Mobile</h2>
        </div>
      </div>
    </div>
    <div class="col-lg-4 col-md-4 col-sm-12 pages-header-button">
      <button
        (click)="create()"
        nz-button
        nzType="primary"
      >
        <i nz-icon nzType="plus" theme="outline"></i>
        <span>Adicionar Acesso Mobile</span>
      </button>
    </div>
  </div>
</div>

<nz-card>  
  <div class="col-lg-8">
    <div class="d-md-flex">
      <div class="m-b-10 m-r-20">
        <nz-input-group [nzPrefix]="prefixTemplate">
          <input
            type="text"
            nz-input
            placeholder="Razão social"
            [(ngModel)]="searchInput"
            (ngModelChange)="searchByName(searchInput)"
          >
        </nz-input-group>
        <ng-template #prefixTemplate>
          <i nz-icon nzType="search" class="opacity-05"></i>
        </ng-template>
      </div>
    </div>
  </div>

  <nz-table
    #resourceTable
    [nzData]="resources?.results"
    [nzTotal]="resources?.count"
    [nzPageSize]="resources?.limit"
    [nzPageIndex]="page"
    [nzFrontPagination]="false"
    (nzQueryParams)="handleQueryParamsChange($event)"
  >
    <thead>
      <tr>
        <th *ngFor="let column of columns" [nzSortFn]="column.compare">{{ column.title }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of resourceTable.data; let i = index">
        <td>{{ item.choiseChargeType || '-' }}</td>
        <td>{{ item.startAt | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ item.endAt | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ item.customer.tradingName || '-' }}</td>
        <td>{{ item.groupMobileAccess.name || '-' }}</td>
        <td class="text-md-center" style="white-space: nowrap;">
          <button
            (click)="edit(item)"
            nz-button
            nzType="default"
          >
            <i nz-icon nzType="edit" theme="outline"></i> Editar
          </button>
          <button
            nz-button
            nzType="default"
            nzDanger
            class="m-l-10"
            (click)="delete(item)"
          >
            <i nz-icon nzType="delete" theme="outline"></i> Excluir
          </button>
        </td>
      </tr>

    </tbody>
  </nz-table>
</nz-card>

</nz-spin>
