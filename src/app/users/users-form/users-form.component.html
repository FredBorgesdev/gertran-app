<form nz-form nzLayout="vertical" [formGroup]="formGroup" *ngIf="formGroup">
  <div class="row">
    <div class="col-lg-4 col-md-6 col-sm-12">
      <nz-form-item *ngIf="authService.user.isGertranStaff">
        <nz-form-label [nzSpan]="null" nzFor="customer">Empresa</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Empresa inválida!">
          <nz-select
            id="customer"
            nzShowSearch
            nzAllowClear
            nzPlaceHolder="Selecione as empresas deste usuário"
            formControlName="customer"
            nzServerSearch
            nzMode="multiple"
            (nzOnSearch)="selectableCustomerService.searchByName($event)"
            (nzScrollToBottom)="selectableCustomerService.loadMoreCustomers()"
            [nzDropdownRender]="selectLoading"
          >
            <nz-option *ngFor="let customer of selectableCustomerService.customers" [nzLabel]="customer.tradingName" [nzValue]="customer.id"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div class="row">    
    <div class="col-lg-4 col-md-6 col-sm-12" style="display: flex; flex-direction: row;">
      <nz-form-item style="width:100%;">
        <nz-form-label [nzSpan]="null" nzRequired nzFor="cpf">Cpf</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o cpf corretamente">
          <input
            id="cpf"
            type="text"
            nz-input
            formControlName="cpf"
            [textMask]="{ mask: cpfMask, guide: false }"
            style="width:100%"
          />
        </nz-form-control>
      </nz-form-item>
      <button
        nz-button
        nzType="primary"
        (click)="getUserByCpf()"
        class="m-t-28 m-l-5"
        style="margin-top: 28px;"
      >Buscar</button>
    </div>
    <div class="col-lg-4 col-md-6 col-sm-12">  
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzRequired nzFor="name">Nome</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o nome">
          <input id="name" type="text" nz-input formControlName="name" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-4 col-md-6 col-sm-12">
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzRequired nzFor="email">Email</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o email corretamente">
          <input id="email" type="email" nz-input formControlName="email" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-4 col-md-6 col-sm-12">
      <nz-form-item *ngIf="!user?.id">
        <nz-form-label [nzSpan]="null" nzRequired nzFor="password">Senha</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Insira uma senha com no minimo 6 caracteres">
          <input id="password" type="password" nz-input formControlName="password" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-4 col-md-6 col-sm-12">
      <nz-form-item *ngIf="authService.user.isGertranStaff">
        <nz-form-label>Usuário Ativo?</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
          <div nz-col [nzSpan]="12">
            <label nz-checkbox formControlName="isActive">
              <span>Sim</span>
            </label>
          </div>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="col-lg-4 col-md-6 col-sm-12">
      <nz-form-item *ngIf="authService.user.isGertranStaff">
        <nz-form-label>Usuário Gertran?</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
          <label nz-checkbox formControlName="isGertranStaff">
            <span>Sim</span>
          </label>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>    
  <nz-divider></nz-divider>
  <div class="page-buttons">
    <nz-form-item>
      <nz-form-control>
        <button type="button" (click)="backToCustomerList()" nz-button>
          <i class="fas fa-arrow-left m-r-5"></i> Voltar ao Cadastro
        </button>
        <button type="button" nz-button nzType="default" (click)="isChangePasswordModalVisible = true" *ngIf="user?.id">
          <i class="fas fa-lock m-r-5"></i> Trocar senha
        </button>
        <button type="button" (click)="save.emit()" nz-button nzType="primary">
          <i class="fas fa-save m-r-5"></i> Salvar Usuário
        </button>
      </nz-form-control>
    </nz-form-item>
  </div>    
</form>

<nz-modal
  [(nzVisible)]="isChangePasswordModalVisible"
  nzTitle="Trocar senha"
  (nzOnCancel)="isChangePasswordModalVisible = false"
>
  <div *nzModalContent>
    <form nzLayout="vertical" nz-form [formGroup]="validatePasswordForm">
      <nz-form-item>
        <nz-form-label [nzSpan]="null" nzRequired nzFor="password">Senha</nz-form-label>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo com no mínimo 6 caracteres">
          <input id="password" type="password" nz-input formControlName="password" />
        </nz-form-control>
      </nz-form-item>
    </form>
  </div>

  <div *nzModalFooter>
    <button
      nz-button
      nzType="default"
      (click)="isChangePasswordModalVisible = false"
    >Fechar</button>
    <button
      nz-button
      nzType="primary"
      (click)="submitPassword()"
    >Enviar</button>
  </div>
</nz-modal>

<ng-template #selectLoading>
  <nz-spin *ngIf="selectableCustomerService.isLoadingMoreData"></nz-spin>
</ng-template>
