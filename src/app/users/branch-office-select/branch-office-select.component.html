<nz-form-item class="m-b-0">
  <nz-form-control>
    <nz-select
      [ngModel]="selectedCustomerId"
      (ngModelChange)="onSelect($event)"
      nzAllowClear
      nzServerSearch
      nzShowSearch
      nzPlaceHolder="Selecione um cliente"
      (nzOnSearch)="onSearch($event)"
      (nzScrollToBottom)="onScrollToBottom()"
    >
      <nz-option
        *ngIf="filterByAll"
        nzLabel="Todos os clientes"
        nzValue="all"
      ></nz-option>

      <nz-option
        *ngFor="let customer of customerService.customers"
        [nzLabel]="customer.tradingName"
        [nzValue]="customer.id"
      ></nz-option>
    </nz-select>
  </nz-form-control>
</nz-form-item>
