<form nz-form nzLayout="vertical">
  <nz-transfer
    [nzDataSource]="list"
    [nzShowSelectAll]="true"
    [nzListStyle]="{ 'width': '50%', 'height.px': '700' }"
    (nzChange)="changeTransfer()"
  >
  </nz-transfer>
  
  <nz-divider></nz-divider>
  
  <div class="page-buttons">
    <nz-form-item *ngIf="!hideSubmit">
      <nz-form-control>
        <button nz-button nzType="primary" (click)="savePermissions()">Salvar permissões</button>
      </nz-form-control>
    </nz-form-item>
  </div>
</form>
