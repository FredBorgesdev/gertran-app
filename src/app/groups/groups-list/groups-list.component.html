<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  
  <!--
    <nz-breadcrumb>
    <nz-breadcrumb-item>
      <i nz-icon nzType="dashboard"></i>
    </nz-breadcrumb-item>
    <nz-breadcrumb-item>
      Grupos
    </nz-breadcrumb-item>
  </nz-breadcrumb>
  -->
  <div class="pages-header">
    <div class="row m-b-10">
      <div class="col-lg-8 col-md-8 col-sm-12">
        <div class="d-md-flex">
          <div class="m-r-20">
            <h2>Grupos</h2>
          </div>
        </div>
      </div>
      <div *ngIf="authService.user.hasPermission('auth.add_group')" class="col-lg-4 col-md-4 col-sm-12 pages-header-button">
        <button
        (click)="create()"
        nz-button
        nzType="primary"
      >
        <i nz-icon nzType="plus" theme="outline"></i>
        <span>Adicionar Grupo</span>
      </button>
      </div>
    </div>
  </div>
  <nz-card> 

  <div class="row m-b-30">
    <div class="col-lg-4 col-md-6 col-sm-12">
      <nz-input-group [nzPrefix]="prefixTemplate">
        <input type="text" nz-input placeholder="Buscar Grupo" [(ngModel)]="searchInput" (ngModelChange)="search()">
      </nz-input-group>
      <ng-template #prefixTemplate>
        <i nz-icon nzType="search" class="opacity-05"></i>
      </ng-template>
    </div>
  </div>
  <nz-table
    #groupsListTable
    [nzData]="resources?.results"
    [nzTotal]="resources?.count"
    [nzPageSize]="resources?.limit"
    [nzPageIndex]="page"
    [nzFrontPagination]="false"
    (nzQueryParams)="handleQueryParamsChange($event)"
  >
    <thead>
    <tr>
      <th *ngFor="let column of groupsColumn" [nzSortFn]="column.compare">{{ column.title }}</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of groupsListTable.data;  let i=index">
      <td>{{ item.id }}</td>
      <td>
        <div class="d-flex align-items-center">
          <h6 class="m-l-10 m-b-0">{{item.name}}</h6>
        </div>
      </td>
      <td class="d-flex" style="white-space: nowrap;">
        <button
          (click)="edit(item)"
          nz-button
          nzType="default"
          *ngIf="authService.user.hasPermission('auth.change_group')"
        >
          <i nz-icon nzType="edit" theme="outline"></i> Editar
        </button>
        <button
          (click)="delete(item)"
          nz-button
          nzType="default"
          nzDanger
          class="m-l-10"
          *ngIf="authService.user.hasPermission('auth.delete_group')"
        >
          <i nz-icon nzType="delete" theme="outline"></i> Excluir
        </button>
      </td>
    </tr>
    </tbody>
  </nz-table>
</nz-card>
</nz-spin>
