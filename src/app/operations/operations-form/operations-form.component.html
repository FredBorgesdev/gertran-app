<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  <form nz-form nzLayout="vertical" [formGroup]="validateForm">
    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzRequired nzFor="customer">Empresa</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="Empresa inválida!">
        <nz-select
          id="customer"
          nzShowSearch
          nzAllowClear
          nzPlaceHolder="Selecione uma empresa"
          formControlName="customer"
          nzServerSearch
          (nzOnSearch)="selectableCustomerService.searchByName($event)"
          (nzScrollToBottom)="selectableCustomerService.loadMoreCustomers()"
          [nzDropdownRender]="selectLoading"
        >
          <nz-option
            *ngFor="let customer of selectableCustomerService.customers"
            [nzLabel]="customer.tradingName"
            [nzValue]="customer.id"
          ></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzRequired nzFor="name">Nome da operação</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="Insira o nome!">
        <input id="name" type="text" nz-input formControlName="name" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzRequired nzFor="allowedTrackerModels">Modelo de rastreadores permitidos</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o modelo">
        <nz-select
          id="allowedTrackerModels"
          nzShowSearch
          nzAllowClear
          nzPlaceHolder="Selecione uma tecnologia"
          formControlName="allowedTrackerModels"
          nzMode="multiple"
          (ngModelChange)="selectAllTrackerModels($event)"
        >
          <nz-option-group
            *ngFor="let group of trackerTechnologiesWithModels"
            [nzLabel]="group.name"
          >
            <nz-option
              [nzLabel]="group.name + '(TODOS)'"
              [nzValue]="'group_'+group.id"
            ></nz-option>
            <nz-option *ngFor="let option of group.models" [nzLabel]="option.name" [nzValue]="option.id"></nz-option>
          </nz-option-group>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzRequired nzFor="allowedTruckTypes">Tipos de cavalo permitidos</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o modelo">
        <nz-select
          id="allowedTruckTypes"
          nzShowSearch
          nzAllowClear
          nzPlaceHolder="Selecione uma tecnologia"
          formControlName="allowedTruckTypes"
          nzMode="multiple"
          (ngModelChange)="selectAll($event, 'allowedTruckTypes', truckTypes)"
        >
          <nz-option
            nzLabel="TODOS"
            nzValue="all"
            *ngIf="truckTypes.length > 0"
          ></nz-option>
          <nz-option
            *ngFor="let truckType of truckTypes"
            [nzLabel]="truckType.name"
            [nzValue]="truckType.id"
          ></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzRequired nzFor="allowedWagonTypes">Tipos de carreta permitidos</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o modelo">
        <nz-select
          id="allowedWagonTypes"
          nzShowSearch
          nzAllowClear
          nzPlaceHolder="Selecione uma tecnologia"
          formControlName="allowedWagonTypes"
          nzMode="multiple"
          (ngModelChange)="selectAll($event, 'allowedWagonTypes', wagonTypes)"
        >
          <nz-option
            nzLabel="TODOS"
            nzValue="all"
            *ngIf="wagonTypes.length > 0"
          ></nz-option>
          <nz-option
            *ngFor="let wagonType of wagonTypes"
            [nzLabel]="wagonType.name"
            [nzValue]="wagonType.id"
          ></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="null" nzRequired nzFor="requiredPeripherals">Periféricos obrigatórios</nz-form-label>
      <nz-form-control [nzSpan]="null" nzErrorTip="Preencha os periféricos">
        <nz-select
          id="requiredPeripherals"
          nzShowSearch
          nzAllowClear
          nzPlaceHolder="Selecione uma tecnologia"
          formControlName="requiredPeripherals"
          nzMode="multiple"
          (ngModelChange)="selectAll($event, 'requiredPeripherals', vehiclePeripherals)"
        >
          <nz-option
            nzLabel="TODOS"
            nzValue="all"
            *ngIf="vehiclePeripherals.length > 0"
          ></nz-option>
          <nz-option
            *ngFor="let peripheral of vehiclePeripherals"
            [nzLabel]="peripheral.name"
            [nzValue]="peripheral.id"
          ></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <div nz-row nzGutter="16">
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzRequired nzFor="insuranceCompany">Seguradora</nz-form-label>
          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha a seguradora">
            <nz-select
              id="insuranceCompany"
              nzShowSearch
              nzAllowClear
              nzPlaceHolder="Selecione a seguradora"
              formControlName="insuranceCompany"
            >
              <nz-option *ngFor="let insuranceCompany of insuranceCompanies" [nzLabel]="insuranceCompany.name" [nzValue]="insuranceCompany.id"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzRequired nzFor="policyEffectiveDate">Vigência da apólice</nz-form-label>
          <nz-form-control nzErrorTip="Data inválida!">
            <nz-date-picker
              style="width: 100%;"
              id="policyEffectiveDate"
              nzFormat="dd/MM/yyyy"
              formControlName="policyEffectiveDate"
              nzPlaceHolder="Selecione a data"
            ></nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <nz-form-item>
      <div nz-row>
        <div nz-col nzSpan="12">
          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
            <div nz-col [nzSpan]="12">
              <label nz-checkbox formControlName="authorizeAutomaticMonitoring">
                <span>Monitoramento automático?</span>
              </label>
            </div>
          </nz-form-control>

          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
            <div nz-col [nzSpan]="12">
              <label nz-checkbox formControlName="followMonitoring">
                <span>Acompanhar monitoramento?</span>
              </label>
            </div>
          </nz-form-control>
        </div>

        <div nz-col  nzSpan="12">
          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
            <div nz-col [nzSpan]="12">
              <label nz-checkbox formControlName="isMain">
                <span>É o principal?</span>
              </label>
            </div>
          </nz-form-control>

          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
            <div nz-col [nzSpan]="12">
              <label nz-checkbox formControlName="followMonitoring">
                <span>DDR</span>
              </label>
            </div>
          </nz-form-control>
        </div>
      </div>
    </nz-form-item>

    <div nz-row nzGutter="16">
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzRequired nzFor="operationType">Tipo de operação</nz-form-label>
          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
            <nz-select
              id="operationType"
              nzShowSearch
              nzAllowClear
              nzPlaceHolder="Selecione o tipo de operação"
              formControlName="operationType"
            >
              <nz-option
                *ngFor="let option of operationTypes"
                [nzLabel]="option.label"
                [nzValue]="option.value"
              ></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzRequired nzFor="radiusToActivateRouteDeviation">Raio de ativação</nz-form-label>
          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
            <input
              id="radiusToActivateRouteDeviation"
              type="number"
              nz-input
              formControlName="radiusToActivateRouteDeviation"
            />
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div nz-row nzGutter="16">
      <div nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzRequired nzFor="brokerName">Nome da corretora</nz-form-label>
          <nz-form-control [nzSpan]="null" nzErrorTip="Insira o nome!">
            <input id="brokerName" type="text" nz-input formControlName="brokerName" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzRequired nzFor="brokerPhone">Telefone da corretora</nz-form-label>
          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
            <input id="brokerPhone" type="text" nz-input formControlName="brokerPhone" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label [nzSpan]="null" nzRequired nzFor="brokerPersonInCharge">Responsável</nz-form-label>
          <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
            <input id="brokerPersonInCharge" type="text" nz-input formControlName="brokerPersonInCharge" />
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <nz-divider></nz-divider>

    <nz-form-item>
      <nz-form-control [nzOffset]="7" [nzSpan]="12">
        <button type="button" (click)="save()" nz-button nzType="primary">
          <i nz-icon nzType="save"></i>Salvar Operações
        </button>
        <button type="button" (click)="list()" nz-button>
          <i nz-icon nzType="unordered-list"></i>Listar Operações
        </button>
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-spin>

<ng-template #selectLoading>
  <nz-spin *ngIf="selectableCustomerService.isLoadingMoreData"></nz-spin>
</ng-template>
