<nz-spin nzTip="Aguarde..." [nzSpinning]="isLoading">
  <div class="row m-b-30">
    <div class="col-lg-12 text-right">
      <button
        (click)="this.isCreatingRule = true"
        nz-button
        nzType="primary"
      >
        <i nz-icon nzType="plus" theme="outline"></i>
        <span>Adicionar Regra</span>
      </button>
    </div>
  </div>

  <nz-table
    #table
    [nzData]="resources?.results"
    [nzTotal]="resources?.count"
    [nzPageSize]="resources?.limit"
    [nzPageIndex]="page"
    [nzFrontPagination]="false"
    (nzQueryParams)="handleQueryParamsChange($event)"
  >
    <thead>
    <tr>
      <th *ngFor="let column of operationsRulesColumns" [nzSortFn]="column.compare">{{ column.title }}</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of table.data; let i=index">
      <td> {{item.minimumPriceValue | reais}} </td>
      <td>{{item.maximumPriceValue | reais}}</td>
      <td>{{item.redundancyMinimum}}</td>
      <td>
        <nz-badge *ngIf="item.armedGuard" nzStatus="success"></nz-badge>
        <nz-badge *ngIf="!item.armedGuard" nzStatus="error"></nz-badge>
      </td>
      <td>
        <nz-badge *ngIf="item.rfBait" nzStatus="success"></nz-badge>
        <nz-badge *ngIf="!item.rfBait" nzStatus="error"></nz-badge>
      </td>
      <td class="text-md-center">
        <a
          (click)="edit(item)"
          class="m-r-5"
          nz-button
          nzType="default"
          nzShape="circle"
          nz-tooltip
          nzTooltipTitle="Editar"
        >
          <i nz-icon nzType="edit" theme="outline"></i>
        </a>
        <button
          nz-button
          nzType="default"
          nzShape="circle"
          nz-tooltip
          nzTooltipTitle="Excluir"
          (click)="delete(item)"
        >
          <i nz-icon nzType="delete" theme="outline"></i>
        </button>
      </td>
    </tr>
    </tbody>
  </nz-table>
</nz-spin>

<nz-modal
  [(nzVisible)]="isCreatingRule"
  nzTitle="Regra"
  (nzOnCancel)="isCreatingRule = false"
  (nzOnOk)="save()"
>
  <ng-container *nzModalContent>
    <form nz-form nzLayout="vertical" [formGroup]="validateForm">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="minimumPriceValue">Valor minimo</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <input
            id="minimumPriceValue"
            type="text"
            nz-input
            formControlName="minimumPriceValue"
            [textMask]="{ mask: reaisMask }"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired nzFor="maximumPriceValue">Valor máximo</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <input
            id="maximumPriceValue"
            type="text"
            nz-input
            formControlName="maximumPriceValue"
            [textMask]="{ mask: reaisMask }"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired nzFor="redundancyMinimum">Mínimo redundancia</nz-form-label>
        <nz-form-control nzErrorTip="Preencha o campo">
          <nz-select
            id="redundancyMinimum"
            type="text"
            formControlName="redundancyMinimum"
          >
            <nz-option *ngFor="let option of minimumRedundancyOptions" [nzLabel]="option.label" [nzValue]="option.value"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
          <div nz-col [nzSpan]="12">
            <label nz-checkbox formControlName="armedGuard">
              <span>Escolta armada</span>
            </label>
          </div>
        </nz-form-control>
        <nz-form-control [nzSpan]="null" nzErrorTip="Preencha o campo">
          <div nz-col [nzSpan]="12">
            <label nz-checkbox formControlName="rfBait">
              <span>Isca RF</span>
            </label>
          </div>
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
